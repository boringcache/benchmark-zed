name: "Zed Runs-on S3 Cargo layers"
run-name: ${{ format('Zed Runs-on S3 | CLI {0}', inputs.cli_version || 'Action default') }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact immutable BoringCache CLI release tag.
        required: false
        type: string
        default: ""
      base_sha:
        description: Seed commit. Defaults to cargo-layer-source.env.
        required: false
        type: string
        default: ""
      head_sha:
        description: Adjacent commit built by every warm lane. Defaults to cargo-layer-source.env.
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: benchmark-zed-runs-on-s3
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  ZED_BUNDLE: "true"
  CC: clang
  CXX: clang++
  BORINGCACHE_TOKEN_FILE: /dev/null

jobs:
  source:
    name: Resolve adjacent Zed source
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.source.outputs.base_sha }}
      head_sha: ${{ steps.source.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Use the S3 benchmark workspace
        run: |
          set -euo pipefail
          sed -i 's|^workspace = ".*"|workspace = "boringcache/benchmark-runs-on-s3"|' .boringcache.toml
          find plans -name .boringcache.toml -exec sed -i 's|^workspace = ".*"|workspace = "boringcache/benchmark-runs-on-s3"|' {} +
          test "$(find plans -name .boringcache.toml -exec grep -lFx 'workspace = "boringcache/benchmark-runs-on-s3"' {} + | wc -l)" -eq 8

      - name: Select the reviewed source pair
        id: source
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          source cargo-layer-source.env
          echo "base_sha=${INPUT_BASE_SHA:-$ZED_BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${INPUT_HEAD_SHA:-$ZED_HEAD_SHA}" >> "$GITHUB_OUTPUT"

  cold:
    name: "Cold: target + sccache seed"
    needs: source
    if: github.ref_name == 'main'
    runs-on: runs-on=${{ github.run_id }}/cpu=16/ram=64/family=m7i.*+m7a/image=ubuntu24-full-x64/volume=300gb:gp3/env=benchmark/region=us-east-1/spot=false
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - name: Use the S3 benchmark workspace
        run: |
          set -euo pipefail
          sed -i 's|^workspace = ".*"|workspace = "boringcache/benchmark-runs-on-s3"|' .boringcache.toml
          find plans -name .boringcache.toml -exec sed -i 's|^workspace = ".*"|workspace = "boringcache/benchmark-runs-on-s3"|' {} +
          test "$(find plans -name .boringcache.toml -exec grep -lFx 'workspace = "boringcache/benchmark-runs-on-s3"' {} + | wc -l)" -eq 8

      - name: Use the benchmark Python toolchain
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Prepare the seed source and release toolchain
        run: ./scripts/prepare-zed-lane.sh "${{ needs.source.outputs.base_sha }}"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Require an empty target
        run: test ! -e upstream/target

      - name: Start lane timing
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Select the cold primary CLI plan
        run: ./scripts/activate-cargo-plan.sh cold primary

      - name: Build the primary seed through the combined Cargo plan
        id: primary
        uses: boringcache/one@476c7df90bc1e7c2c4066aa7eb31cc057ef7f8d1 # v1 / 1.32.0
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: cargo
          trust-policy: publish
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
        env:
          RUSTFLAGS: '-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib'

      - name: Select the cold remote-server CLI plan
        run: ./scripts/activate-cargo-plan.sh cold remote-server

      - name: Build the remote server seed through the combined Cargo plan
        id: remote
        uses: boringcache/one@476c7df90bc1e7c2c4066aa7eb31cc057ef7f8d1 # v1 / 1.32.0
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: cargo
          trust-policy: publish
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
        env:
          RUSTFLAGS: '-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib -C target-feature=+crt-static'
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Report cold-layer evidence
        run: |
          echo "lane_seconds=$(( $(date +%s) - ${{ steps.timer.outputs.started_at }} ))" >> "$GITHUB_STEP_SUMMARY"
          ./scripts/summarize-cargo-evidence.py \
            cold-primary "${{ steps.primary.outputs.evidence-path }}" \
            cold-remote-server "${{ steps.remote.outputs.evidence-path }}"

      - name: Retain cold product evidence
        uses: actions/upload-artifact@v6
        with:
          name: zed-cargo-layers-cold
          path: |
            ${{ steps.primary.outputs.evidence-path }}
            ${{ steps.remote.outputs.evidence-path }}
          if-no-files-found: error

  target-only:
    name: "Target only: compiler cache disabled"
    needs: [source, cold]
    runs-on: runs-on=${{ github.run_id }}/cpu=16/ram=64/family=m7i.*+m7a/image=ubuntu24-full-x64/volume=300gb:gp3/env=benchmark/region=us-east-1/spot=false
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - name: Use the S3 benchmark workspace
        run: |
          set -euo pipefail
          sed -i 's|^workspace = ".*"|workspace = "boringcache/benchmark-runs-on-s3"|' .boringcache.toml
          find plans -name .boringcache.toml -exec sed -i 's|^workspace = ".*"|workspace = "boringcache/benchmark-runs-on-s3"|' {} +
          test "$(find plans -name .boringcache.toml -exec grep -lFx 'workspace = "boringcache/benchmark-runs-on-s3"' {} + | wc -l)" -eq 8

      - name: Use the benchmark Python toolchain
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Prepare the adjacent source and release toolchain
        run: ./scripts/prepare-zed-lane.sh "${{ needs.source.outputs.head_sha }}" "${{ needs.source.outputs.base_sha }}"

      - name: Require an empty target
        run: test ! -e upstream/target

      - name: Start lane timing
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Select the target-only primary CLI plan
        run: ./scripts/activate-cargo-plan.sh target-only primary

      - name: Build primary with the target-only Cargo plan
        id: primary
        uses: boringcache/one@476c7df90bc1e7c2c4066aa7eb31cc057ef7f8d1 # v1 / 1.32.0
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: cargo
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
        env:
          RUSTFLAGS: '-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib'

      - name: Select the target-only remote-server CLI plan
        run: ./scripts/activate-cargo-plan.sh target-only remote-server

      - name: Build remote server with the target-only Cargo plan
        id: remote
        uses: boringcache/one@476c7df90bc1e7c2c4066aa7eb31cc057ef7f8d1 # v1 / 1.32.0
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: cargo
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
        env:
          RUSTFLAGS: '-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib -C target-feature=+crt-static'
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Report target-only evidence
        run: |
          test "${{ steps.primary.outputs.cache-hit }}" = "true"
          echo "lane_seconds=$(( $(date +%s) - ${{ steps.timer.outputs.started_at }} ))" >> "$GITHUB_STEP_SUMMARY"
          ./scripts/summarize-cargo-evidence.py \
            target-only-primary "${{ steps.primary.outputs.evidence-path }}" \
            target-only-remote-server "${{ steps.remote.outputs.evidence-path }}"

      - name: Retain target-only product evidence
        uses: actions/upload-artifact@v6
        with:
          name: zed-cargo-layers-target-only
          path: |
            ${{ steps.primary.outputs.evidence-path }}
            ${{ steps.remote.outputs.evidence-path }}
          if-no-files-found: error

  sccache-only:
    name: "sccache only: target excluded"
    needs: [source, cold]
    runs-on: runs-on=${{ github.run_id }}/cpu=16/ram=64/family=m7i.*+m7a/image=ubuntu24-full-x64/volume=300gb:gp3/env=benchmark/region=us-east-1/spot=false
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - name: Use the S3 benchmark workspace
        run: |
          set -euo pipefail
          sed -i 's|^workspace = ".*"|workspace = "boringcache/benchmark-runs-on-s3"|' .boringcache.toml
          find plans -name .boringcache.toml -exec sed -i 's|^workspace = ".*"|workspace = "boringcache/benchmark-runs-on-s3"|' {} +
          test "$(find plans -name .boringcache.toml -exec grep -lFx 'workspace = "boringcache/benchmark-runs-on-s3"' {} + | wc -l)" -eq 8

      - name: Use the benchmark Python toolchain
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Prepare the adjacent source and release toolchain
        run: ./scripts/prepare-zed-lane.sh "${{ needs.source.outputs.head_sha }}" "${{ needs.source.outputs.base_sha }}"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Require an empty target
        run: test ! -e upstream/target

      - name: Start lane timing
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Select the sccache-only primary CLI plan
        run: ./scripts/activate-cargo-plan.sh sccache-only primary

      - name: Build primary with the sccache-only Cargo plan
        id: primary
        uses: boringcache/one@476c7df90bc1e7c2c4066aa7eb31cc057ef7f8d1 # v1 / 1.32.0
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: cargo
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
        env:
          RUSTFLAGS: '-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib'

      - name: Select the sccache-only remote-server CLI plan
        run: ./scripts/activate-cargo-plan.sh sccache-only remote-server

      - name: Build remote server with the sccache-only Cargo plan
        id: remote
        uses: boringcache/one@476c7df90bc1e7c2c4066aa7eb31cc057ef7f8d1 # v1 / 1.32.0
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: cargo
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
        env:
          RUSTFLAGS: '-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib -C target-feature=+crt-static'
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Report sccache-only evidence
        run: |
          echo "lane_seconds=$(( $(date +%s) - ${{ steps.timer.outputs.started_at }} ))" >> "$GITHUB_STEP_SUMMARY"
          ./scripts/summarize-cargo-evidence.py \
            sccache-only-primary "${{ steps.primary.outputs.evidence-path }}" \
            sccache-only-remote-server "${{ steps.remote.outputs.evidence-path }}"

      - name: Retain sccache-only product evidence
        uses: actions/upload-artifact@v6
        with:
          name: zed-cargo-layers-sccache-only
          path: |
            ${{ steps.primary.outputs.evidence-path }}
            ${{ steps.remote.outputs.evidence-path }}
          if-no-files-found: error

  combined:
    name: "Combined: target + sccache"
    needs: [source, cold]
    runs-on: runs-on=${{ github.run_id }}/cpu=16/ram=64/family=m7i.*+m7a/image=ubuntu24-full-x64/volume=300gb:gp3/env=benchmark/region=us-east-1/spot=false
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - name: Use the S3 benchmark workspace
        run: |
          set -euo pipefail
          sed -i 's|^workspace = ".*"|workspace = "boringcache/benchmark-runs-on-s3"|' .boringcache.toml
          find plans -name .boringcache.toml -exec sed -i 's|^workspace = ".*"|workspace = "boringcache/benchmark-runs-on-s3"|' {} +
          test "$(find plans -name .boringcache.toml -exec grep -lFx 'workspace = "boringcache/benchmark-runs-on-s3"' {} + | wc -l)" -eq 8

      - name: Use the benchmark Python toolchain
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Prepare the adjacent source and release toolchain
        run: ./scripts/prepare-zed-lane.sh "${{ needs.source.outputs.head_sha }}" "${{ needs.source.outputs.base_sha }}"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Require an empty target
        run: test ! -e upstream/target

      - name: Start lane timing
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Select the combined primary CLI plan
        run: ./scripts/activate-cargo-plan.sh combined primary

      - name: Build primary with the combined Cargo plan
        id: primary
        uses: boringcache/one@476c7df90bc1e7c2c4066aa7eb31cc057ef7f8d1 # v1 / 1.32.0
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: cargo
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
        env:
          RUSTFLAGS: '-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib'

      - name: Select the combined remote-server CLI plan
        run: ./scripts/activate-cargo-plan.sh combined remote-server

      - name: Build remote server with the combined Cargo plan
        id: remote
        uses: boringcache/one@476c7df90bc1e7c2c4066aa7eb31cc057ef7f8d1 # v1 / 1.32.0
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: cargo
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
        env:
          RUSTFLAGS: '-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib -C target-feature=+crt-static'
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Report combined evidence
        run: |
          test "${{ steps.primary.outputs.cache-hit }}" = "true"
          echo "lane_seconds=$(( $(date +%s) - ${{ steps.timer.outputs.started_at }} ))" >> "$GITHUB_STEP_SUMMARY"
          ./scripts/summarize-cargo-evidence.py \
            combined-primary "${{ steps.primary.outputs.evidence-path }}" \
            combined-remote-server "${{ steps.remote.outputs.evidence-path }}"

      - name: Retain combined product evidence
        uses: actions/upload-artifact@v6
        with:
          name: zed-cargo-layers-combined
          path: |
            ${{ steps.primary.outputs.evidence-path }}
            ${{ steps.remote.outputs.evidence-path }}
          if-no-files-found: error

  report:
    name: Compare Cargo layers
    needs: [cold, target-only, sccache-only, combined]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Use the S3 benchmark workspace
        run: |
          set -euo pipefail
          sed -i 's|^workspace = ".*"|workspace = "boringcache/benchmark-runs-on-s3"|' .boringcache.toml
          find plans -name .boringcache.toml -exec sed -i 's|^workspace = ".*"|workspace = "boringcache/benchmark-runs-on-s3"|' {} +
          test "$(find plans -name .boringcache.toml -exec grep -lFx 'workspace = "boringcache/benchmark-runs-on-s3"' {} + | wc -l)" -eq 8

      - name: Download every lane's product evidence
        uses: actions/download-artifact@v6
        with:
          pattern: zed-cargo-layers-*
          path: layer-evidence

      - name: Publish the independent layer report
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          args=()
          while IFS= read -r evidence; do
            label="$(basename "$(dirname "$evidence")")/$(basename "$evidence")"
            args+=("$label" "$evidence")
          done < <(find layer-evidence -type f -name '*.json' -print | sort)
          test "${#args[@]}" -gt 0
          ./scripts/summarize-cargo-evidence.py "${args[@]}" |
            tee benchmark-results/zed-cargo-layer-matrix.md

      - name: Retain the layer report
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-zed-cargo-layer-matrix
          path: benchmark-results/zed-cargo-layer-matrix.md
          if-no-files-found: error
