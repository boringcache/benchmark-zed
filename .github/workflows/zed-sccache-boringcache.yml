name: "Zed sccache - BC"
run-name: ${{ inputs.cache_lane == 'rolling' && 'BC Rolling' || 'BC Fresh' }}

on:
  workflow_call:
    inputs:
      cache_lane:
        required: false
        type: string
        default: fresh
      cli_version:
        description: "Optional BoringCache CLI release tag for canary runs."
        required: false
        type: string
        default: ""
      cache_target:
        description: "Restore the full Cargo target archive alongside remote sccache."
        required: false
        type: boolean
        default: false
concurrency:
  group: zed-sccache-boringcache-${{ github.ref_name }}-${{ inputs.cache_lane || 'fresh' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PROJECT_REPO: zed-industries/zed
  BENCHMARK_ID: zed-sccache
  BENCHMARK_WORKSPACE: ${{ github.repository }}
  PROJECT_RUST_VERSION: "1.95.0"

jobs:
  seed-cache:
    name: ${{ inputs.cache_lane == 'rolling' && 'Commit' || 'Cold' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BORINGCACHE_PROXY_METADATA_HINTS: benchmark=zed-sccache,phase=${{ inputs.cache_lane == 'rolling' && 'rolling' || 'cold' }}
    outputs:
      tags_csv: ${{ steps.resolved_seed_tags.outputs.tags_csv }}
      sccache_tag: ${{ steps.resolved_seed_tags.outputs.sccache_tag }}
      cold_seconds: ${{ steps.cold_baseline_build.outputs.seconds }}
      cold_build_seconds: ${{ steps.cold_baseline_build.outputs.build_seconds }}
    steps:
      - name: Validate BoringCache secrets
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${BORINGCACHE_RESTORE_TOKEN}" ]] || { echo "Missing BoringCache restore token" >&2; exit 1; }
          [[ -n "${BORINGCACHE_SAVE_TOKEN}" ]] || { echo "Missing BoringCache save token" >&2; exit 1; }

      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout pinned upstream submodule shallowly
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Prepare base benchmark source tree
        run: ./scripts/prepare-source.sh base

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libssl-dev pkg-config cmake \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.PROJECT_RUST_VERSION }}

      - name: Prepare benchmark scope and helpers
        id: scope
        run: |
          set -euo pipefail

          scope_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ref_slug="$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')"
          ref_slug="${ref_slug#-}"
          ref_slug="${ref_slug%-}"
          ref_slug="${ref_slug:-main}"
          if [[ "${{ inputs.cache_lane || 'fresh' }}" == "rolling" ]]; then
            # v2 retires a legacy archive whose CACHEDIR.TAG mode cannot be restored by current clients.
            cache_tag_prefix="${BENCHMARK_ID}-v2-rolling-${ref_slug}"
          else
            cache_tag_prefix="${BENCHMARK_ID}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          fi

          ./scripts/scope-boringcache-run.sh "$cache_tag_prefix"

          {
            echo "scope_started_at=${scope_started_at}"
            echo "cache_tag_prefix=${cache_tag_prefix}"
          } >> "$GITHUB_OUTPUT"

          cat > ./run-zed-sccache-phase.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          mode="${1:-warm}"
          timing_file="${BENCHMARK_TIMING_FILE:-}"
          stats_file="${BENCHMARK_SCCACHE_STATS_FILE:-}"
          build_seconds=""

          write_timing() {
            if [[ -n "$timing_file" ]]; then
              printf '%s=%s\n' "$1" "$2" >> "$timing_file"
            fi
          }

          run_cold_build() {
            (
              cd upstream
              cargo build --release
            )
          }

          run_cached_build() {
            export SCCACHE_IDLE_TIMEOUT="0"
            # Cargo git checkouts with nested submodules are not offline-complete
            # after archive restore because .git metadata is excluded from saved
            # entries. Allow network fallback so warm runs reflect the real
            # restore state instead of failing outright.
            unset CARGO_NET_OFFLINE
            mkdir -p "${SCCACHE_DIR:-${HOME}/.cache/sccache}"
            write_timing proxy_ready_seconds 0
            sccache --zero-stats >/dev/null 2>&1 || true

            local started_at
            started_at="$(date +%s)"
            (
              cd upstream
              cargo build --release
            )
            if [[ -n "$stats_file" ]]; then
              sccache --show-stats | tee "$stats_file" || true
            else
              sccache --show-stats || true
            fi
            build_seconds=$(( $(date +%s) - started_at ))
            write_timing build_seconds "$build_seconds"
          }

          if [[ -n "$timing_file" ]]; then
            : > "$timing_file"
          fi

          case "$mode" in
            cold)
              run_cold_build
              ;;
            seed|warm)
              run_cached_build
              ;;
            *)
              echo "Unknown mode: $mode" >&2
              exit 1
              ;;
          esac
          SH
          chmod +x ./run-zed-sccache-phase.sh

      - name: Reset local build state
        run: |
          set -euo pipefail
          rm -rf upstream/target
          if [[ "${{ inputs.cache_lane || 'fresh' }}" != "rolling" ]]; then
            rm -rf "$HOME/.cargo/registry" "$HOME/.cargo/git" "$HOME/.cache/sccache"
            mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git" "$HOME/.cache/sccache"
          fi

      - name: Capture managed sccache setup start
        id: managed_seed_setup_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Configure boringcache/one for Rust sccache benchmark
        id: managed_seed_setup
        uses: boringcache/one@8294be671cd5a2b73638df1b8e1e240df888297e # v1.15.0
        with:
          setup: none
          cli-version: ${{ inputs.cli_version }}
          mode: sccache
          trust-policy: publish
          working-directory: ./upstream
          cache-profiles: ${{ inputs.cache_target && 'zed-target' || 'cargo-deps' }}
          sccache-version: 0.14.0
          verbose: true
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          BORINGCACHE_NO_GIT: "true"

      - name: Capture resolved BoringCache tags
        id: resolved_seed_tags
        env:
          RESOLVED_TAGS: ${{ steps.managed_seed_setup.outputs.resolved-tags }}
          SCCACHE_TAG: ${{ steps.managed_seed_setup.outputs.sccache-tag }}
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tags+=("$tag")
            fi
          done <<< "$RESOLVED_TAGS"
          sccache_recorded=false
          for tag in "${tags[@]}"; do
            if [[ "$tag" == "$SCCACHE_TAG" ]]; then
              sccache_recorded=true
              break
            fi
          done
          if [[ -n "$SCCACHE_TAG" && "$sccache_recorded" != true ]]; then
            tags+=("$SCCACHE_TAG")
          fi
          tags_csv="$(IFS=,; echo "${tags[*]}")"
          {
            echo "tags_csv=${tags_csv}"
            echo "sccache_tag=${SCCACHE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Capture managed sccache setup timing
        id: managed_seed_setup_timing
        run: |
          set -euo pipefail
          start="${{ steps.managed_seed_setup_start.outputs.started_at }}"
          end="$(date +%s)"
          echo "seconds=$((end - start))" >> "$GITHUB_OUTPUT"

      - name: Initialize Cargo source mtime cache
        if: ${{ inputs.cache_target }}
        run: |
          set -euo pipefail
          node ./scripts/run-mtime-cache.js ./upstream | tee /tmp/zed-mtime-seed.txt
          added="$(awk '$1 == "*" && $2 == "added:" { print $3 }' /tmp/zed-mtime-seed.txt)"
          if [[ "${added:-0}" -lt 1 ]]; then
            echo "Cargo source mtime cache recorded no source files" >&2
            exit 1
          fi

      - name: ${{ inputs.cache_lane == 'rolling' && 'Run rolling commit build' || 'Run fresh cold build' }}
        id: cold_baseline_build
        run: |
          set -euo pipefail
          phase_start="${{ steps.managed_seed_setup_start.outputs.started_at }}"
          start="$(date +%s)"
          stats_file="/tmp/zed-sccache-cold-stats.txt"
          BENCHMARK_PHASE_LABEL="cold" BENCHMARK_SCCACHE_STATS_FILE="$stats_file" ./run-zed-sccache-phase.sh seed
          end="$(date +%s)"
          echo "seconds=$((end - phase_start))" >> "$GITHUB_OUTPUT"
          echo "build_seconds=$((end - start))" >> "$GITHUB_OUTPUT"

      - name: Capture target working set
        if: ${{ inputs.cache_target }}
        run: |
          set -euo pipefail
          target_bytes="$(du -sb upstream/target | cut -f1)"
          target_files="$(find upstream/target -type f | wc -l | tr -d ' ')"
          echo "Target working set: ${target_bytes} bytes across ${target_files} files"

      - name: Persist build native tool stats
        if: always()
        run: |
          set -euo pipefail
          mkdir -p benchmark-native-tool
          stats_file="/tmp/zed-sccache-cold-stats.txt"
          if [[ -f "$stats_file" ]]; then
            cp "$stats_file" benchmark-native-tool/build-sccache-stats.txt
          fi

      - name: Upload build native tool stats
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-native-tool-${{ env.BENCHMARK_ID }}-boringcache-build
          path: benchmark-native-tool/build-sccache-stats.txt
          if-no-files-found: ignore

      - name: Collect BoringCache diagnostics
        if: always() && hashFiles('scripts/collect-boringcache-diagnostics.sh') != ''
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          set -euo pipefail
          diagnostic_phase="${{ inputs.cache_lane == 'rolling' && 'rolling' || 'cold' }}"
          ./scripts/collect-boringcache-diagnostics.sh \
            --output-dir "boringcache-diag-${diagnostic_phase}" \
            --workspace "$BENCHMARK_WORKSPACE" \
            --tags "${{ steps.resolved_seed_tags.outputs.tags_csv }}" \
            --phase "$diagnostic_phase" \
            --cache-tag "${{ steps.resolved_seed_tags.outputs.sccache_tag }}" \
            --proxy-port "${{ steps.managed_seed_setup.outputs.proxy-port }}" \
            --proxy-log-path "${{ steps.managed_seed_setup.outputs.proxy-log-path }}" \
            --cache-root "$HOME/.cache/sccache" \
            --cache-label "sccache-cache"

      - name: Upload BoringCache diagnostics
        if: always() && hashFiles('boringcache-diag-*/**/*') != ''
        uses: actions/upload-artifact@v6
        with:
          name: boringcache-diag-${{ env.BENCHMARK_ID }}-${{ inputs.cache_lane == 'rolling' && 'rolling' || 'cold' }}-boringcache
          path: boringcache-diag-${{ inputs.cache_lane == 'rolling' && 'rolling' || 'cold' }}
          if-no-files-found: warn

      - name: Capture BoringCache session summary
        if: always()
        run: |
          set -euo pipefail
          diagnostic_phase="${{ inputs.cache_lane == 'rolling' && 'rolling' || 'cold' }}"
          status_path="boringcache-diag-${diagnostic_phase}/proxy-status-${diagnostic_phase}.json"
          mkdir -p benchmark-session-summary
          if [[ -s "$status_path" ]]; then
            jq -c '.session_summary // empty' "$status_path" > benchmark-session-summary/benchmark-session-summary.json || true
          fi
          if [[ ! -s benchmark-session-summary/benchmark-session-summary.json ]]; then
            rm -f benchmark-session-summary/benchmark-session-summary.json
          fi

      - name: Upload BoringCache session summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-session-summary-${{ env.BENCHMARK_ID }}-boringcache-${{ inputs.cache_lane || 'fresh' }}
          path: benchmark-session-summary/benchmark-session-summary.json
          if-no-files-found: ignore


  scenario-builds:
    name: Warm / ${{ matrix.variant }}
    needs: seed-cache
    if: ${{ inputs.cache_lane != 'rolling' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.cache_target && '["sccache-only", "target-sccache"]' || '["sccache-only"]') }}
    env:
      BORINGCACHE_PROXY_METADATA_HINTS: benchmark=zed-sccache,phase=${{ matrix.variant }}
    steps:
      - name: Validate BoringCache restore secret
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${BORINGCACHE_RESTORE_TOKEN}" ]] || { echo "Missing BoringCache restore token" >&2; exit 1; }

      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout pinned upstream submodule shallowly
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Prepare scenario source tree
        run: ./scripts/prepare-source.sh warm1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libssl-dev pkg-config cmake \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.PROJECT_RUST_VERSION }}

      - name: Prepare benchmark scope and helpers
        id: scope
        run: |
          set -euo pipefail

          scope_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ref_slug="$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')"
          ref_slug="${ref_slug#-}"
          ref_slug="${ref_slug%-}"
          ref_slug="${ref_slug:-main}"
          if [[ "${{ inputs.cache_lane || 'fresh' }}" == "rolling" ]]; then
            # Keep the warm scope aligned with the seed scope if rolling warm runs are enabled later.
            cache_tag_prefix="${BENCHMARK_ID}-v2-rolling-${ref_slug}"
          else
            cache_tag_prefix="${BENCHMARK_ID}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          fi

          ./scripts/scope-boringcache-run.sh "$cache_tag_prefix"

          {
            echo "scope_started_at=${scope_started_at}"
            echo "cache_tag_prefix=${cache_tag_prefix}"
          } >> "$GITHUB_OUTPUT"

          cat > ./run-zed-sccache-phase.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          mode="${1:-warm}"
          timing_file="${BENCHMARK_TIMING_FILE:-}"
          stats_file="${BENCHMARK_SCCACHE_STATS_FILE:-}"
          build_seconds=""

          write_timing() {
            if [[ -n "$timing_file" ]]; then
              printf '%s=%s\n' "$1" "$2" >> "$timing_file"
            fi
          }

          run_cold_build() {
            (
              cd upstream
              cargo build --release
            )
          }

          run_cached_build() {
            export SCCACHE_IDLE_TIMEOUT="0"
            # Cargo git checkouts with nested submodules are not offline-complete
            # after archive restore because .git metadata is excluded from saved
            # entries. Allow network fallback so warm runs reflect the real
            # restore state instead of failing outright.
            unset CARGO_NET_OFFLINE
            mkdir -p "${SCCACHE_DIR:-${HOME}/.cache/sccache}"
            write_timing proxy_ready_seconds 0
            sccache --zero-stats >/dev/null 2>&1 || true

            local started_at
            started_at="$(date +%s)"
            (
              cd upstream
              cargo build --release
            )
            if [[ -n "$stats_file" ]]; then
              sccache --show-stats | tee "$stats_file" || true
            else
              sccache --show-stats || true
            fi
            build_seconds=$(( $(date +%s) - started_at ))
            write_timing build_seconds "$build_seconds"
          }

          if [[ -n "$timing_file" ]]; then
            : > "$timing_file"
          fi

          case "$mode" in
            cold)
              run_cold_build
              ;;
            seed|warm)
              run_cached_build
              ;;
            *)
              echo "Unknown mode: $mode" >&2
              exit 1
              ;;
          esac
          SH
          chmod +x ./run-zed-sccache-phase.sh

      - name: Reset local scenario state
        run: |
          set -euo pipefail
          rm -rf upstream/target "$HOME/.cargo/registry" "$HOME/.cargo/git" "$HOME/.cache/sccache"
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git" "$HOME/.cache/sccache"

      - name: Capture managed sccache setup start
        id: managed_scenario_setup_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Configure boringcache/one for Rust sccache benchmark
        id: managed_scenario_setup
        uses: boringcache/one@8294be671cd5a2b73638df1b8e1e240df888297e # v1.15.0
        with:
          setup: none
          cli-version: ${{ inputs.cli_version }}
          mode: sccache
          trust-policy: restore
          working-directory: ./upstream
          cache-profiles: ${{ matrix.variant == 'target-sccache' && 'zed-target' || 'cargo-deps' }}
          sccache-version: 0.14.0
          verbose: true
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_NO_GIT: "true"

      - name: Capture resolved BoringCache tags
        id: resolved_scenario_tags
        env:
          RESOLVED_TAGS: ${{ steps.managed_scenario_setup.outputs.resolved-tags }}
          SCCACHE_TAG: ${{ steps.managed_scenario_setup.outputs.sccache-tag }}
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tags+=("$tag")
            fi
          done <<< "$RESOLVED_TAGS"
          sccache_recorded=false
          for tag in "${tags[@]}"; do
            if [[ "$tag" == "$SCCACHE_TAG" ]]; then
              sccache_recorded=true
              break
            fi
          done
          if [[ -n "$SCCACHE_TAG" && "$sccache_recorded" != true ]]; then
            tags+=("$SCCACHE_TAG")
          fi
          tags_csv="$(IFS=,; echo "${tags[*]}")"
          echo "tags_csv=${tags_csv}" >> "$GITHUB_OUTPUT"
          echo "sccache_tag=${SCCACHE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Require restored Cargo dependency state
        run: |
          set -euo pipefail
          registry_files="$(find "$HOME/.cargo/registry" -type f | wc -l | tr -d ' ')"
          git_files="$(find "$HOME/.cargo/git" -type f | wc -l | tr -d ' ')"
          if [[ "$registry_files" -lt 1 || "$git_files" -lt 1 ]]; then
            echo "Cargo dependency archives were not fully restored" >&2
            exit 1
          fi
          echo "Restored ${registry_files} Cargo registry files and ${git_files} Cargo git files before Cargo started"

      - name: Require restored target state
        if: ${{ matrix.variant == 'target-sccache' }}
        run: |
          set -euo pipefail
          test -d upstream/target
          target_files="$(find upstream/target -type f | wc -l | tr -d ' ')"
          if [[ "$target_files" -lt 1 ]]; then
            echo "Target archive restored no files" >&2
            exit 1
          fi
          echo "Restored ${target_files} target files before Cargo started"

      - name: Restore Cargo source mtimes
        if: ${{ matrix.variant == 'target-sccache' }}
        run: |
          set -euo pipefail
          node ./scripts/run-mtime-cache.js ./upstream | tee /tmp/zed-mtime-warm.txt
          restored="$(awk '$1 == "*" && $2 == "restored:" { print $3 }' /tmp/zed-mtime-warm.txt)"
          invalid="$(awk '$1 == "*" && $2 == "invalid:" { print $3 }' /tmp/zed-mtime-warm.txt)"
          if [[ "${restored:-0}" -lt 1 || "${invalid:-0}" -ne 0 ]]; then
            echo "Cargo source mtime restoration was incomplete" >&2
            exit 1
          fi

      - name: Capture managed sccache setup timing
        id: managed_scenario_setup_timing
        run: |
          set -euo pipefail
          start="${{ steps.managed_scenario_setup_start.outputs.started_at }}"
          end="$(date +%s)"
          echo "seconds=$((end - start))" >> "$GITHUB_OUTPUT"

      - name: Run warm build
        id: warm1_build
        run: |
          set -euo pipefail
          timing_file="/tmp/zed-sccache-warm1-timing.env"
          phase_start="${{ steps.managed_scenario_setup_start.outputs.started_at }}"
          start="$(date +%s)"
          stats_file="/tmp/zed-sccache-warm1-stats.txt"
          BENCHMARK_PHASE_LABEL="warm" BENCHMARK_TIMING_FILE="$timing_file" BENCHMARK_SCCACHE_STATS_FILE="$stats_file" ./run-zed-sccache-phase.sh warm
          cache_hits="$(awk '$1 == "Cache" && $2 == "hits" { print $3; exit }' "$stats_file")"
          if [[ "${{ matrix.variant }}" == "sccache-only" && "${cache_hits:-0}" -lt 1 ]]; then
            echo "Warm sccache build produced zero native cache hits" >&2
            exit 1
          fi
          end="$(date +%s)"
          echo "seconds=$((end - phase_start))" >> "$GITHUB_OUTPUT"
          echo "proxy_ready_seconds=$(grep '^proxy_ready_seconds=' "$timing_file" | head -n1 | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          echo "build_seconds=$(grep '^build_seconds=' "$timing_file" | head -n1 | cut -d= -f2-)" >> "$GITHUB_OUTPUT"


      - name: Collect BoringCache diagnostics
        if: always() && hashFiles('scripts/collect-boringcache-diagnostics.sh') != ''
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          set -euo pipefail
          ./scripts/collect-boringcache-diagnostics.sh \
            --output-dir "boringcache-diag-${{ matrix.variant }}" \
            --workspace "$BENCHMARK_WORKSPACE" \
            --tags "${{ steps.resolved_scenario_tags.outputs.tags_csv }}" \
            --phase "${{ matrix.variant }}" \
            --cache-tag "${{ steps.resolved_scenario_tags.outputs.sccache_tag }}" \
            --proxy-port "${{ steps.managed_scenario_setup.outputs.proxy-port }}" \
            --proxy-log-path "${{ steps.managed_scenario_setup.outputs.proxy-log-path }}" \
            --cache-root "$HOME/.cache/sccache" \
            --cache-label "sccache-cache"

      - name: Upload BoringCache diagnostics
        if: always() && hashFiles('boringcache-diag-*/*') != ''
        uses: actions/upload-artifact@v6
        with:
          name: boringcache-diag-${{ env.BENCHMARK_ID }}-${{ matrix.variant }}-boringcache
          path: boringcache-diag-${{ matrix.variant }}
          if-no-files-found: warn

      - name: Capture scenario timing
        id: phase_timing
        run: |
          set -euo pipefail
          seconds=""
          restore_seconds=""
          proxy_ready_seconds=""
          build_seconds=""
          seconds="${{ steps.warm1_build.outputs.seconds }}"
          restore_seconds="${{ steps.managed_scenario_setup_timing.outputs.seconds }}"
          proxy_ready_seconds="${{ steps.warm1_build.outputs.proxy_ready_seconds }}"
          build_seconds="${{ steps.warm1_build.outputs.build_seconds }}"
          if [[ -z "${seconds}" || -z "${restore_seconds}" || -z "${proxy_ready_seconds}" || -z "${build_seconds}" ]]; then
            echo "No timing captured for warm" >&2
            exit 1
          fi
          echo "seconds=${seconds}" >> "$GITHUB_OUTPUT"
          echo "restore_seconds=${restore_seconds}" >> "$GITHUB_OUTPUT"
          echo "proxy_ready_seconds=${proxy_ready_seconds}" >> "$GITHUB_OUTPUT"
          echo "build_seconds=${build_seconds}" >> "$GITHUB_OUTPUT"
          echo "end_to_end_seconds=${seconds}" >> "$GITHUB_OUTPUT"
      - name: Persist scenario timing artifact
        run: |
          set -euo pipefail
          mkdir -p benchmark-phase
          cpu_model="$(awk -F: '/^model name/ { value=$2; sub(/^[[:space:]]+/, "", value); print value; exit }' /proc/cpuinfo)"
          logical_cores="$(nproc)"
          cat > "benchmark-phase/warm1-${{ matrix.variant }}.env" <<EOF
          phase=warm1-${{ matrix.variant }}
          seconds=${{ steps.phase_timing.outputs.seconds }}
          restore_seconds=${{ steps.phase_timing.outputs.restore_seconds }}
          proxy_ready_seconds=${{ steps.phase_timing.outputs.proxy_ready_seconds }}
          build_seconds=${{ steps.phase_timing.outputs.build_seconds }}
          end_to_end_seconds=${{ steps.phase_timing.outputs.end_to_end_seconds }}
          cpu_model=${cpu_model}
          logical_cores=${logical_cores}
          EOF
          stats_file="/tmp/zed-sccache-warm1-stats.txt"
          if [[ -f "$stats_file" ]]; then
            cp "$stats_file" "benchmark-phase/warm1-${{ matrix.variant }}-sccache-stats.txt"
          fi
          mtime_file="/tmp/zed-mtime-warm.txt"
          if [[ -f "$mtime_file" ]]; then
            cp "$mtime_file" "benchmark-phase/warm1-${{ matrix.variant }}-mtime.txt"
          fi
      - name: Upload scenario timing artifact
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-phase-${{ env.BENCHMARK_ID }}-boringcache-${{ matrix.variant }}
          path: benchmark-phase/warm1-${{ matrix.variant }}*
          if-no-files-found: error

  finalize-benchmark:
    name: Report
    needs: [seed-cache, scenario-builds]
    if: ${{ always() && needs.seed-cache.result == 'success' && (needs.scenario-builds.result == 'success' || needs.scenario-builds.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Install BoringCache CLI
        run: >-
          ./scripts/install-boringcache-cli.sh
          "${{ inputs.cli_version }}"
          "linux-amd64"
      - name: Verify BoringCache CLI
        run: boringcache --version

      - name: Download scenario timing artifacts
        if: ${{ inputs.cache_lane != 'rolling' }}
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-phase-${{ env.BENCHMARK_ID }}-boringcache-*
          path: benchmark-phase
          merge-multiple: true

      - name: Download build native tool stats
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: benchmark-native-tool-${{ env.BENCHMARK_ID }}-boringcache-build
          path: benchmark-native-tool

      - name: Download BoringCache session summary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: benchmark-session-summary-${{ env.BENCHMARK_ID }}-boringcache-${{ inputs.cache_lane || 'fresh' }}
          path: benchmark-session-summary
      - name: Collect scenario timings
        if: ${{ inputs.cache_lane != 'rolling' }}
        id: timings
        run: |
          set -euo pipefail
          parse_phase() {
            local phase="$1"
            local key="$2"
            local file="benchmark-phase/${phase}.env"
            if [[ ! -f "$file" ]]; then
              echo "Missing timing artifact for phase ${phase}" >&2
              ls -R benchmark-phase || true
              exit 1
            fi
            local seconds
            seconds="$(grep "^seconds=" "$file" | head -n1 | cut -d= -f2-)"
            if [[ -z "${seconds}" ]]; then
              echo "Timing artifact for phase ${phase} has empty seconds" >&2
              cat "$file" >&2
              exit 1
            fi
            echo "${key}_seconds=${seconds}" >> "$GITHUB_OUTPUT"
            local field value
            for field in build_seconds restore_seconds proxy_ready_seconds cpu_model logical_cores; do
              value="$(grep "^${field}=" "$file" | head -n1 | cut -d= -f2- || true)"
              if [[ -n "${value}" ]]; then
                echo "${key}_${field}=${value}" >> "$GITHUB_OUTPUT"
              fi
            done
          }
          if [[ "${{ inputs.cache_target }}" == "true" ]]; then
            parse_phase warm1-target-sccache warm1
            parse_phase warm1-sccache-only control
          else
            parse_phase warm1-sccache-only warm1
          fi

      - name: Write controlled target comparison
        if: ${{ inputs.cache_target }}
        run: |
          set -euo pipefail
          control_seconds="${{ steps.timings.outputs.control_seconds }}"
          control_build_seconds="${{ steps.timings.outputs.control_build_seconds }}"
          control_restore_seconds="${{ steps.timings.outputs.control_restore_seconds }}"
          control_proxy_ready_seconds="${{ steps.timings.outputs.control_proxy_ready_seconds }}"
          control_cpu_model="${{ steps.timings.outputs.control_cpu_model }}"
          control_logical_cores="${{ steps.timings.outputs.control_logical_cores }}"
          target_seconds="${{ steps.timings.outputs.warm1_seconds }}"
          target_build_seconds="${{ steps.timings.outputs.warm1_build_seconds }}"
          target_restore_seconds="${{ steps.timings.outputs.warm1_restore_seconds }}"
          target_proxy_ready_seconds="${{ steps.timings.outputs.warm1_proxy_ready_seconds }}"
          target_cpu_model="${{ steps.timings.outputs.warm1_cpu_model }}"
          target_logical_cores="${{ steps.timings.outputs.warm1_logical_cores }}"
          delta_seconds=$((control_seconds - target_seconds))
          delta_build_seconds=$((control_build_seconds - target_build_seconds))
          speedup_percent="$(awk -v control="$control_seconds" -v target="$target_seconds" 'BEGIN { if (control > 0) printf "%.1f", ((control - target) * 100) / control; else print "0.0" }')"

          mkdir -p benchmark-comparison
          jq -n \
            --argjson control_seconds "$control_seconds" \
            --argjson control_build_seconds "$control_build_seconds" \
            --argjson control_restore_seconds "$control_restore_seconds" \
            --argjson control_proxy_ready_seconds "$control_proxy_ready_seconds" \
            --arg control_cpu_model "$control_cpu_model" \
            --argjson control_logical_cores "$control_logical_cores" \
            --argjson target_seconds "$target_seconds" \
            --argjson target_build_seconds "$target_build_seconds" \
            --argjson target_restore_seconds "$target_restore_seconds" \
            --argjson target_proxy_ready_seconds "$target_proxy_ready_seconds" \
            --arg target_cpu_model "$target_cpu_model" \
            --argjson target_logical_cores "$target_logical_cores" \
            --argjson delta_seconds "$delta_seconds" \
            --argjson delta_build_seconds "$delta_build_seconds" \
            --arg speedup_percent "$speedup_percent" \
            '{
              schema_version: 1,
              experiment: "zed-target-plus-sccache",
              invariant: "one cold seed, one source, one Cargo dependency state, one remote sccache population, fresh ubuntu-latest consumers",
              comparability: {
                cpu_model_matched: ($control_cpu_model == $target_cpu_model),
                logical_cores_matched: ($control_logical_cores == $target_logical_cores)
              },
              sccache_only: {
                wall_seconds: $control_seconds,
                restore_seconds: $control_restore_seconds,
                proxy_ready_seconds: $control_proxy_ready_seconds,
                build_seconds: $control_build_seconds,
                cpu_model: $control_cpu_model,
                logical_cores: $control_logical_cores
              },
              target_plus_sccache: {
                wall_seconds: $target_seconds,
                restore_seconds: $target_restore_seconds,
                proxy_ready_seconds: $target_proxy_ready_seconds,
                build_seconds: $target_build_seconds,
                cpu_model: $target_cpu_model,
                logical_cores: $target_logical_cores
              },
              target_advantage: {wall_seconds: $delta_seconds, build_seconds: $delta_build_seconds, wall_percent: ($speedup_percent | tonumber)}
            }' > benchmark-comparison/target-sccache.json

          {
            echo "## Controlled target + sccache comparison"
            echo
            echo "Both fresh consumers use the same source, Cargo dependency archives, and exact cold-seeded remote sccache population. Only the target+sccache consumer restores the target archive."
            echo
            echo "| Cache shape | Setup + build | Build only |"
            echo "|---|---:|---:|"
            echo "| Cargo deps + sccache | ${control_seconds}s | ${control_build_seconds}s |"
            echo "| Cargo deps + target + sccache | ${target_seconds}s | ${target_build_seconds}s |"
            echo
            echo "Target advantage: ${delta_seconds}s (${speedup_percent}%) end to end; ${delta_build_seconds}s in Cargo build."
            echo
            echo "CPU cohorts: sccache-only ${control_cpu_model} (${control_logical_cores} cores); target+sccache ${target_cpu_model} (${target_logical_cores} cores)."
            if [[ "$control_cpu_model" != "$target_cpu_model" ]]; then
              echo
              echo "The CPU models differ, so the observed build and end-to-end deltas are not fully attributable to target restoration."
            fi
          } > benchmark-comparison/target-sccache.md

      - name: Upload controlled target comparison
        if: ${{ inputs.cache_target }}
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ env.BENCHMARK_ID }}-target-sccache-control
          path: benchmark-comparison/target-sccache.*
          if-no-files-found: error
      - name: Measure BoringCache storage usage
        id: cache_size
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_EXACT_TAGS: ${{ needs.seed-cache.outputs.sccache_tag }}
        run: |
          tags_csv="${{ needs.seed-cache.outputs.tags_csv }}"
          mkdir -p benchmark-storage
          breakdown_path="benchmark-storage/boringcache-storage-breakdown.json"
          bytes="$(BORINGCACHE_STORAGE_BREAKDOWN_PATH="$breakdown_path" ./scripts/sum-boringcache-check-sizes.sh "$BENCHMARK_WORKSPACE" "$tags_csv")"
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"
          echo "breakdown_path=${breakdown_path}" >> "$GITHUB_OUTPUT"

      - name: Capture committed upstream ref
        id: upstream_ref
        run: echo "sha=$(git rev-parse HEAD:upstream)" >> "$GITHUB_OUTPUT"

      - name: Collect BoringCache action timing report
        id: action_timing_report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ./scripts/collect-boringcache-action-timings.py \
            --benchmark "$BENCHMARK_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --output-dir benchmark-results

      - name: Write benchmark artifacts
        id: artifact_files
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          cache_summary_args=()
          if [[ -s benchmark-session-summary/benchmark-session-summary.json ]]; then
            cache_summary_args=(--cache-session-summary-json benchmark-session-summary/benchmark-session-summary.json)
          fi
          native_tool_args=()
          if [[ "${{ inputs.cache_lane || 'fresh' }}" != "rolling" && -s benchmark-phase/warm1-target-sccache-sccache-stats.txt ]]; then
            native_tool_args=(--native-tool sccache --sccache-stats-file benchmark-phase/warm1-target-sccache-sccache-stats.txt)
          elif [[ "${{ inputs.cache_lane || 'fresh' }}" != "rolling" && -s benchmark-phase/warm1-sccache-only-sccache-stats.txt ]]; then
            native_tool_args=(--native-tool sccache --sccache-stats-file benchmark-phase/warm1-sccache-only-sccache-stats.txt)
          elif [[ -s benchmark-native-tool/build-sccache-stats.txt ]]; then
            native_tool_args=(--native-tool sccache --sccache-stats-file benchmark-native-tool/build-sccache-stats.txt)
          fi

          ./scripts/write-benchmark-artifacts.sh \
            --benchmark "$BENCHMARK_ID" \
            --strategy "boringcache" \
            --lane "${{ inputs.cache_lane || 'fresh' }}" \
            --project-repo "$PROJECT_REPO" \
            --project-ref "${{ steps.upstream_ref.outputs.sha }}" \
            --cold-seconds "${{ needs.seed-cache.outputs.cold_seconds }}" \
            --cold-build-seconds "${{ needs.seed-cache.outputs.cold_build_seconds }}" \
            --warm1-seconds "${{ inputs.cache_lane == 'rolling' && '' || steps.timings.outputs.warm1_seconds }}" \
            --warm1-build-seconds "${{ inputs.cache_lane == 'rolling' && '' || steps.timings.outputs.warm1_build_seconds }}" \
            --cache-storage-bytes "${{ steps.cache_size.outputs.bytes }}" \
            --cache-storage-source "boringcache-check" \
            --storage-breakdown-json "${{ steps.cache_size.outputs.breakdown_path }}" \
            --action-timings-json "${{ steps.action_timing_report.outputs.json_path }}" \
            --hit-behavior-note "${{ inputs.cache_lane == 'rolling' && 'Rolling lane: this run builds the current upstream commit as-is with the prior rolling cache available, exports the updated cache, and records that commit build only; warm follow-up runs are intentionally skipped.' || inputs.cache_target && 'Fresh target+sccache lane: the same immutable boringcache/one v1.15 release restores the full Cargo target profile concurrently with the adapter-owned remote sccache state. Warm runs on a fresh runner with trust-policy=restore and rebuilds the same pinned source tree without synthetic mutations.' || 'Fresh sccache-only lane: the same immutable boringcache/one v1.15 release uses pure adapter-owned remote compiler-cache state and no local-disk archives. Warm runs on a fresh runner with trust-policy=restore and rebuilds the same pinned source tree without synthetic mutations.' }}" \
            "${cache_summary_args[@]}" \
            "${native_tool_args[@]}"

      - name: Write phase timing breakdown
        id: phase_breakdown
        run: |
          python3 ./scripts/write-phase-timing-breakdown.py \
            --benchmark "$BENCHMARK_ID" \
            --strategy "boringcache" \
            --phase-dir benchmark-phase \
            --output-dir benchmark-results

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ env.BENCHMARK_ID }}-boringcache-${{ inputs.cache_lane || 'fresh' }}
          path: |
            ${{ steps.artifact_files.outputs.json_path }}
            ${{ steps.artifact_files.outputs.md_path }}
            ${{ steps.phase_breakdown.outputs.json_path }}
            ${{ steps.phase_breakdown.outputs.md_path }}
            ${{ steps.action_timing_report.outputs.json_path }}
            ${{ steps.action_timing_report.outputs.md_path }}
          if-no-files-found: error

      - name: Publish summary
        run: |
          cat "${{ steps.artifact_files.outputs.md_path }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -s benchmark-comparison/target-sccache.md ]]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat benchmark-comparison/target-sccache.md >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat "${{ steps.action_timing_report.outputs.md_path }}" >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat "${{ steps.phase_breakdown.outputs.md_path }}" >> "$GITHUB_STEP_SUMMARY"
