name: Zed RunsOn cache phase

on:
  workflow_call:
    inputs:
      provider:
        required: true
        type: string
      phase:
        required: true
        type: string
      cache_variant:
        required: false
        type: string
        default: target
      source_sha:
        required: true
        type: string
      restore_phase:
        required: false
        type: string
        default: ""
      expected_parent:
        required: false
        type: string
        default: ""
      rolling_step:
        required: false
        type: string
        default: ""
      rolling_previous:
        required: false
        type: string
        default: ""
      cli_version:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write
  id-token: write

env:
  CARGO_INCREMENTAL: "0"
  ZED_BUNDLE: "true"
  CC: clang
  CXX: clang++
  RUSTFLAGS: '-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib'
  BORINGCACHE_TOKEN_FILE: /dev/null
  BORINGCACHE_NO_GIT: "true"

jobs:
  build:
    name: ${{ inputs.provider }} ${{ inputs.phase }}
    runs-on: ${{ inputs.provider == 'runs-on-cache' && format('runs-on={0}/cpu=16/ram=64/family=m7i.*+m7a/image=ubuntu24-full-x64/volume=300gb:gp3/env=benchmark/region=us-east-1/spot=false/extras=s3-cache', github.run_id) || format('runs-on={0}/cpu=16/ram=64/family=m7i.*+m7a/image=ubuntu24-full-x64/volume=300gb:gp3/env=benchmark/region=us-east-1/spot=false', github.run_id) }}
    timeout-minutes: 240
    steps:
      - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2.3.1
        with:
          sccache: ${{ inputs.provider == 'runs-on-cache' && inputs.cache_variant != 'target' && 's3' || '' }}
      - uses: actions/checkout@v6
      - name: Start the workflow timer
        id: workflow_timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Prepare the exact Zed source and toolchain
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_PARENT: ${{ inputs.expected_parent }}
        run: ./scripts/prepare-zed-lane.sh "$SOURCE_SHA" "$EXPECTED_PARENT"
      - name: Install sccache
        if: inputs.cache_variant != 'target'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Scope RunsOn direct S3 compiler cache
        if: inputs.provider == 'runs-on-cache' && inputs.cache_variant != 'target'
        run: |
          set -euo pipefail
          test -n "${SCCACHE_BUCKET:-}"
          test -n "${SCCACHE_REGION:-}"
          export SCCACHE_S3_KEY_PREFIX="cache/sccache/benchmark-zed/${{ inputs.cache_variant }}/r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          echo "SCCACHE_S3_KEY_PREFIX=$SCCACHE_S3_KEY_PREFIX" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          import subprocess

          stats = json.loads(subprocess.check_output(["sccache", "--show-stats", "--stats-format=json"]))
          location = stats.get("cache_location")
          if not isinstance(location, str) or location.split(",", 1)[0].strip().lower() != "s3":
              raise SystemExit(f"Expected direct S3 sccache backend, got {location!r}")
          print("Direct S3 sccache backend is active")
          PY
      - name: Select the same Cargo command and a fresh cache cohort
        env:
          CACHE_VARIANT: ${{ inputs.cache_variant }}
          ROLLING_STEP: ${{ inputs.rolling_step }}
        run: |
          set -euo pipefail
          case "$CACHE_VARIANT" in
            target) plan=target-only ;;
            target-sccache) plan=combined ;;
            sccache-only) plan=sccache-only ;;
            *) echo "Unknown cache variant: $CACHE_VARIANT" >&2; exit 1 ;;
          esac
          ./scripts/activate-cargo-plan.sh "$plan" primary
          scope="zed-runson-$CACHE_VARIANT-r$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"
          if [[ -n "$ROLLING_STEP" ]]; then
            scope="zed-roll-$CACHE_VARIANT-r$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"
          fi
          sed 's|^workspace = ".*"|workspace = "boringcache/benchmark-runs-on-s3-clean"|' "plans/$plan/primary/.boringcache.toml" |
            sed "s|tag = \"|tag = \"$scope-|g" > "$RUNNER_TEMP/zed-plan.toml"
          rm upstream/.boringcache.toml
          cp "$RUNNER_TEMP/zed-plan.toml" upstream/.boringcache.toml
          if [[ "$CACHE_VARIANT" == sccache-only ]]; then
            sed -i 's/profiles = \["cargo-product"\]/profiles = ["compiler-only"]/' upstream/.boringcache.toml
          fi
          test ! -e upstream/target
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"
      - name: Start the cache and build timer
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Name Magic Cache keys
        id: magic_keys
        env:
          CACHE_VARIANT: ${{ inputs.cache_variant }}
          PHASE: ${{ inputs.phase }}
          ROLLING_STEP: ${{ inputs.rolling_step }}
          ROLLING_PREVIOUS: ${{ inputs.rolling_previous }}
          RESTORE_PHASE: ${{ inputs.restore_phase }}
        run: |
          set -euo pipefail
          if [[ -n "$ROLLING_STEP" ]]; then
            prefix="zed-magic-$CACHE_VARIANT-roll-r$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"
            echo "restore=$prefix-step$ROLLING_PREVIOUS" >> "$GITHUB_OUTPUT"
            echo "save=$prefix-step$ROLLING_STEP" >> "$GITHUB_OUTPUT"
          else
            prefix="zed-magic-$CACHE_VARIANT-r$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"
            previous="${RESTORE_PHASE:-warm}"
            [[ "$PHASE" != warm ]] || previous=cold
            echo "restore=$prefix-$previous" >> "$GITHUB_OUTPUT"
            echo "save=$prefix-$PHASE" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore RunsOn Magic Cache
        id: magic_restore
        if: inputs.provider == 'runs-on-cache' && inputs.phase != 'cold' && inputs.cache_variant != 'sccache-only'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/target
          key: ${{ steps.magic_keys.outputs.restore }}
          fail-on-cache-miss: true
      - name: Record cache setup time
        id: setup_timer
        run: echo "seconds=$(( $(date +%s) - ${{ steps.timer.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"
      - name: Build with BoringCache
        id: boringcache
        if: inputs.provider == 'boringcache'
        uses: boringcache/one@476c7df90bc1e7c2c4066aa7eb31cc057ef7f8d1 # v1 / 1.32.0
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: cargo
          trust-policy: publish
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
      - name: Build with RunsOn cache
        if: inputs.provider == 'runs-on-cache'
        working-directory: upstream
        env:
          RUSTC_WRAPPER: ${{ inputs.cache_variant != 'target' && 'sccache' || '' }}
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib
          with open(".boringcache.toml", "rb") as source:
              command = tomllib.load(source)["adapters"]["cargo"]["command"]
          subprocess.run(command, check=True)
          PY
      - name: Report RunsOn native sccache stats
        if: inputs.provider == 'runs-on-cache' && inputs.cache_variant != 'target'
        run: |
          mkdir -p benchmark-results
          sccache --show-stats --stats-format=json > benchmark-results/magic-sccache.json
      - name: Save RunsOn Magic Cache
        if: inputs.provider == 'runs-on-cache' && inputs.cache_variant != 'sccache-only'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/target
          key: ${{ steps.magic_keys.outputs.save }}
      - name: Verify release binary and cache reuse
        env:
          PROVIDER: ${{ inputs.provider }}
          PHASE: ${{ inputs.phase }}
          CACHE_VARIANT: ${{ inputs.cache_variant }}
          MAGIC_HIT: ${{ steps.magic_restore.outputs.cache-hit }}
          BORINGCACHE_HIT: ${{ steps.boringcache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test -x upstream/target/x86_64-unknown-linux-gnu/release/zed
          if [[ "$PHASE" != cold && "$CACHE_VARIANT" != sccache-only ]]; then
            if [[ "$PROVIDER" == runs-on-cache ]]; then
              test "$MAGIC_HIT" = true
            else
              test "$BORINGCACHE_HIT" = true
            fi
          fi
      - name: Write phase evidence
        env:
          PROVIDER: ${{ inputs.provider }}
          CACHE_VARIANT: ${{ inputs.cache_variant }}
          PHASE: ${{ inputs.rolling_step != '' && 'commit' || inputs.phase }}
          LANE: ${{ inputs.rolling_step != '' && 'rolling' || (inputs.cache_variant == 'target' && 'fresh' || inputs.cache_variant) }}
          VARIANT: ${{ inputs.rolling_step != '' && format('step{0}{1}', inputs.rolling_step, inputs.phase == 'warm' && '-warm' || '') || '' }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STARTED_AT: ${{ steps.timer.outputs.started_at }}
          WORKFLOW_STARTED_AT: ${{ steps.workflow_timer.outputs.started_at }}
          SETUP_SECONDS: ${{ inputs.provider == 'runs-on-cache' && steps.setup_timer.outputs.seconds || '0' }}
          CACHE_HIT: ${{ inputs.provider == 'runs-on-cache' && steps.magic_restore.outputs.cache-hit || steps.boringcache.outputs.cache-hit }}
          EVIDENCE_PATH: ${{ steps.boringcache.outputs.evidence-path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ./scripts/collect-zed-cache-evidence.py \
            --provider "$PROVIDER" \
            --cache-variant "$CACHE_VARIANT" \
            --action-evidence "$EVIDENCE_PATH" \
            --magic-hit "$CACHE_HIT" \
            --output benchmark-results/cache-evidence.json
          python3 ./scripts/benchmark-report.py phase \
            --benchmark zed-runson \
            --strategy "$PROVIDER" \
            --lane "$LANE" \
            --phase "$PHASE" \
            --variant "$VARIANT" \
            --mode cargo \
            --restore-or-setup-seconds "$SETUP_SECONDS" \
            --build-seconds "$(( $(date +%s) - STARTED_AT - SETUP_SECONDS ))" \
            --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
            --cache-hit "$CACHE_HIT" \
            --source-repository zed-industries/zed \
            --source-sha "$SOURCE_SHA" \
            --evidence "$EVIDENCE_PATH" \
            --cache-evidence benchmark-results/cache-evidence.json
      - name: Retain BoringCache action evidence
        if: inputs.provider == 'boringcache'
        env:
          EVIDENCE_PATH: ${{ steps.boringcache.outputs.evidence-path }}
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_PATH"
          cp "$EVIDENCE_PATH" benchmark-results/action-evidence.json
      - uses: actions/upload-artifact@v6
        with:
          name: phase-zed-runson-${{ inputs.provider }}-${{ inputs.rolling_step != '' && format('step{0}', inputs.rolling_step) || inputs.phase }}
          path: benchmark-results/
          if-no-files-found: error
