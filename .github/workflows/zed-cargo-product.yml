name: "Zed Cargo product run"
run-name: ${{ format('Zed Cargo fresh | CLI {0}', inputs.cli_version || 'Action default') }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "Exact immutable BoringCache CLI release tag."
        required: false
        type: string
        default: ""
      runner_label:
        description: Optional runner label for a manual main-branch experiment.
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 4 * * 5"
  pull_request:
    paths:
      - ".github/workflows/zed-cargo-product.yml"
      - ".gitmodules"
      - "scripts/**"
      - "upstream"

permissions:
  actions: read
  contents: read

env:
  BORINGCACHE_CLI_VERSION: ${{ inputs.cli_version }}
  CACHE_SCOPE: zed-cargo-r${{ github.run_id }}-a${{ github.run_attempt }}

jobs:
  publish-base:
    name: BoringCache Zed Cargo cold
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 240
    outputs:
      base_sha: ${{ steps.source.outputs.base_sha }}
      head_sha: ${{ steps.source.outputs.head_sha }}
    steps:
      - name: Start the workflow timer
        id: workflow_timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Checkout the pinned Zed commit and its parent
        id: source
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 2 --recommend-shallow --jobs 4 upstream
          head_sha="$(git -C upstream rev-parse HEAD)"
          if ! base_sha="$(git -C upstream rev-parse HEAD^ 2>/dev/null)"; then
            git -C upstream fetch --deepen=1 origin "$head_sha"
            base_sha="$(git -C upstream rev-parse HEAD^)"
          fi
          git -C upstream checkout --detach "$base_sha"
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

      - name: Prepare the base source tree
        run: ./scripts/prepare-source.sh base

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libssl-dev pkg-config cmake \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev \
            musl-tools clang

      - name: Install Zed's pinned Rust toolchain
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^channel = "\(.*\)"$/\1/p' upstream/rust-toolchain.toml)"
          test -n "$pinned"
          grep -Fxq "ZED_RUST_VERSION=${pinned}" benchmark-source.env
          rustup toolchain install "$pinned" --profile minimal
          rustup default "$pinned"
          rustup target add x86_64-unknown-linux-musl

      - name: Verify Zed release recipe
        run: ./scripts/verify-zed-release-recipe.py upstream

      - name: Mirror Zed's bundle release version
        run: |
          set -euo pipefail
          version="$(cd upstream && script/get-crate-version zed)"
          test -n "$version"
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Scope the Cargo product plan
        run: ./scripts/scope-boringcache-run.sh "$CACHE_SCOPE"

      - name: Require a cold target
        run: test ! -e upstream/target

      - name: Start the build timer
        id: build_timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      
      - name: Run the released Cargo product
        id: cache
        uses: boringcache/one@78e1fd3257bbdf27722c46b500a39b6626fc8d27 # v1 / 1.18.0
        with:
          cli-version: ${{ env.BORINGCACHE_CLI_VERSION }}
          setup: none
          mode: cargo
          trust-policy: publish
          working-directory: upstream
          fail-on-cache-error: true
          metadata-hints: phase=base-primary
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          ZED_BUNDLE: "true"
          CC: clang
          RUSTFLAGS: -C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib

      - name: Select Zed's remote_server release command
        run: ./scripts/select-zed-cargo-phase.py remote-server

      - name: Build remote_server through the Cargo product
        id: cache_remote
        uses: boringcache/one@78e1fd3257bbdf27722c46b500a39b6626fc8d27 # v1 / 1.18.0
        with:
          cli-version: ${{ env.BORINGCACHE_CLI_VERSION }}
          setup: none
          mode: cargo
          trust-policy: publish
          working-directory: upstream
          fail-on-cache-error: true
          metadata-hints: phase=base-remote-server
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          ZED_BUNDLE: "true"
          CC: clang
          RUSTFLAGS: -C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib -C target-feature=+crt-static
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Capture the build timing
        id: build_timing
        env:
          BUILD_STARTED_AT: ${{ steps.build_timer.outputs.started_at }}
        run: echo "build_seconds=$(( $(date +%s) - BUILD_STARTED_AT ))" >> "$GITHUB_OUTPUT"
      
      - name: Summarize the Cargo rebuild set
        if: always()
        run: |
          ./scripts/summarize-cargo-evidence.py \
            primary "${{ steps.cache.outputs.evidence-path }}" \
            remote-server "${{ steps.cache_remote.outputs.evidence-path }}"

      - name: Verify the Zed build
        run: |
          set -euo pipefail
          test -x upstream/target/x86_64-unknown-linux-gnu/release/zed
          test -x upstream/target/x86_64-unknown-linux-gnu/release/cli
          test -x upstream/target/x86_64-unknown-linux-musl/release/remote_server
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

      - name: Write the benchmark phase evidence
        env:
          WORKFLOW_STARTED_AT: ${{ steps.workflow_timer.outputs.started_at }}
          BUILD_SECONDS: ${{ steps.build_timing.outputs.build_seconds }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_TAG: ${{ steps.cache.outputs.cache-tag }}
          CACHE_WORKSPACE: ${{ steps.cache.outputs.workspace }}
          EVIDENCE_PATH: ${{ steps.cache.outputs.evidence-path }}
          SOURCE_SHA: ${{ steps.source.outputs.base_sha }}
        run: |
          set -euo pipefail
          source_repository="$(sed -n 's/^ZED_SOURCE_REPOSITORY=//p' benchmark-source.env)"
          python3 ./scripts/benchmark-report.py phase \
            --benchmark zed-cargo \
            --strategy boringcache \
            --lane fresh \
            --phase cold \
            --mode cargo \
            --build-seconds "$BUILD_SECONDS" \
            --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
            --cache-hit "$CACHE_HIT" \
            --cache-tag "$CACHE_TAG" \
            --workspace "$CACHE_WORKSPACE" \
            --source-repository "$source_repository" \
            --source-sha "$SOURCE_SHA" \
            --evidence "$EVIDENCE_PATH"
      
      - name: Retain the benchmark phase evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase-zed-cargo-boringcache-fresh-cold
          path: benchmark-results/
          if-no-files-found: error
      
      - name: Retain base product evidence
        uses: actions/upload-artifact@v6
        with:
          name: zed-cargo-product-base
          path: ${{ steps.cache.outputs.evidence-path }}
          if-no-files-found: error

  consume-head:
    name: BoringCache Zed Cargo warm
    needs: publish-base
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 240
    steps:
      - name: Start the workflow timer
        id: workflow_timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Checkout the pinned Zed head
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 2 --recommend-shallow --jobs 4 upstream
          test "$(git -C upstream rev-parse HEAD)" = "${{ needs.publish-base.outputs.head_sha }}"

      - name: Prepare the head source tree
        run: ./scripts/prepare-source.sh warm1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libssl-dev pkg-config cmake \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev \
            musl-tools clang

      - name: Install Zed's pinned Rust toolchain
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^channel = "\(.*\)"$/\1/p' upstream/rust-toolchain.toml)"
          test -n "$pinned"
          grep -Fxq "ZED_RUST_VERSION=${pinned}" benchmark-source.env
          rustup toolchain install "$pinned" --profile minimal
          rustup default "$pinned"
          rustup target add x86_64-unknown-linux-musl

      - name: Verify Zed release recipe
        run: ./scripts/verify-zed-release-recipe.py upstream

      - name: Mirror Zed's bundle release version
        run: |
          set -euo pipefail
          version="$(cd upstream && script/get-crate-version zed)"
          test -n "$version"
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Scope the same Cargo product plan
        run: ./scripts/scope-boringcache-run.sh "$CACHE_SCOPE"

      - name: Require an empty destination
        run: test ! -e upstream/target

      - name: Start the build timer
        id: build_timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      
      - name: Run the released Cargo product
        id: cache
        uses: boringcache/one@78e1fd3257bbdf27722c46b500a39b6626fc8d27 # v1 / 1.18.0
        with:
          cli-version: ${{ env.BORINGCACHE_CLI_VERSION }}
          setup: none
          mode: cargo
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          metadata-hints: phase=head-primary
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ""
          ZED_BUNDLE: "true"
          CC: clang
          RUSTFLAGS: -C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib

      - name: Select Zed's remote_server release command
        run: ./scripts/select-zed-cargo-phase.py remote-server

      - name: Build remote_server through the Cargo product
        id: cache_remote
        uses: boringcache/one@78e1fd3257bbdf27722c46b500a39b6626fc8d27 # v1 / 1.18.0
        with:
          cli-version: ${{ env.BORINGCACHE_CLI_VERSION }}
          setup: none
          mode: cargo
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          metadata-hints: phase=head-remote-server
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ""
          ZED_BUNDLE: "true"
          CC: clang
          RUSTFLAGS: -C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib -C target-feature=+crt-static
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Capture the build timing
        id: build_timing
        env:
          BUILD_STARTED_AT: ${{ steps.build_timer.outputs.started_at }}
        run: echo "build_seconds=$(( $(date +%s) - BUILD_STARTED_AT ))" >> "$GITHUB_OUTPUT"
      
      - name: Summarize the Cargo rebuild set
        if: always()
        run: |
          ./scripts/summarize-cargo-evidence.py \
            primary "${{ steps.cache.outputs.evidence-path }}" \
            remote-server "${{ steps.cache_remote.outputs.evidence-path }}"

      - name: Verify the Zed build
        run: |
          set -euo pipefail
          test -x upstream/target/x86_64-unknown-linux-gnu/release/zed
          test -x upstream/target/x86_64-unknown-linux-gnu/release/cli
          test -x upstream/target/x86_64-unknown-linux-musl/release/remote_server
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

      - name: Write the benchmark phase evidence
        env:
          WORKFLOW_STARTED_AT: ${{ steps.workflow_timer.outputs.started_at }}
          BUILD_SECONDS: ${{ steps.build_timing.outputs.build_seconds }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_TAG: ${{ steps.cache.outputs.cache-tag }}
          CACHE_WORKSPACE: ${{ steps.cache.outputs.workspace }}
          EVIDENCE_PATH: ${{ steps.cache.outputs.evidence-path }}
          SOURCE_SHA: ${{ needs.publish-base.outputs.head_sha }}
        run: |
          set -euo pipefail
          source_repository="$(sed -n 's/^ZED_SOURCE_REPOSITORY=//p' benchmark-source.env)"
          python3 ./scripts/benchmark-report.py phase \
            --benchmark zed-cargo \
            --strategy boringcache \
            --lane fresh \
            --phase warm \
            --mode cargo \
            --build-seconds "$BUILD_SECONDS" \
            --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
            --cache-hit "$CACHE_HIT" \
            --cache-tag "$CACHE_TAG" \
            --workspace "$CACHE_WORKSPACE" \
            --source-repository "$source_repository" \
            --source-sha "$SOURCE_SHA" \
            --evidence "$EVIDENCE_PATH"
      
      - name: Retain the benchmark phase evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase-zed-cargo-boringcache-fresh-warm
          path: benchmark-results/
          if-no-files-found: error
      
      - name: Publish product run summary
        run: |
          {
            echo "## Zed Cargo product run"
            echo
            echo "- CLI: \`${BORINGCACHE_CLI_VERSION}\`"
            echo "- Source: \`${{ needs.publish-base.outputs.base_sha }}\` → \`${{ needs.publish-base.outputs.head_sha }}\`"
            echo "- Signed target available before the adjacent build: \`${{ steps.cache.outputs.cache-hit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain head product evidence
        uses: actions/upload-artifact@v6
        with:
          name: zed-cargo-product-head
          path: ${{ steps.cache.outputs.evidence-path }}
          if-no-files-found: error

  report:
    name: Zed Cargo fresh report
    needs: consume-head
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Download the benchmark phase evidence
        uses: actions/download-artifact@v6
        with:
          pattern: phase-zed-cargo-*
          path: phase-evidence

      - name: Publish the Zed Cargo fresh benchmark report
        run: |
          python3 ./scripts/benchmark-report.py summarize \
            --title "Zed Cargo fresh benchmark" \
            --input-dir phase-evidence \
            --output-dir benchmark-results

      - name: Retain the Zed Cargo fresh result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-zed-cargo-boringcache-fresh
          path: benchmark-results/zed-cargo-boringcache-fresh.json
          if-no-files-found: error
