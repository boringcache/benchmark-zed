name: "Zed sccache Fresh"
run-name: >-
  ${{ format('Benchmark {0}{1} | {2}', inputs.cli_version != '' && 'Canary' || 'Fresh', inputs.cache_target && ' + target' || '', github.event_name == 'schedule' && 'Weekly' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "Optional BoringCache CLI release tag for canary runs."
        required: false
        type: string
        default: ""
      cache_target:
        description: "Restore the full Cargo target archive alongside remote sccache."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 4 * * 5"

permissions:
  contents: read
  actions: write

jobs:
  github-actions-cache:
    name: GHA
    if: ${{ !inputs.cache_target }}
    uses: ./.github/workflows/zed-sccache-actions-cache.yml
    with:
      cache_lane: fresh
    secrets: inherit

  boringcache:
    name: BC
    uses: ./.github/workflows/zed-sccache-boringcache.yml
    with:
      cache_lane: fresh
      cli_version: ${{ inputs.cli_version }}
      cache_target: ${{ inputs.cache_target }}
    secrets: inherit
