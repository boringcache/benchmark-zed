name: "Zed Cargo rolling run"
run-name: ${{ format('Zed Cargo rolling {0} to {1}', inputs.base_sha, inputs.head_sha) }}

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Source commit currently represented by the published target.
        required: true
        type: string
      head_sha:
        description: Dependency-verified descendant to build and publish as the next seed.
        required: true
        type: string
      source_distance:
        description: Number of first-parent commits from the published seed to the selected source.
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: write

concurrency:
  group: benchmark-zed-cargo-rolling-chain
  cancel-in-progress: false

jobs:
  benchmark:
    name: Benchmark the selected Zed source
    uses: ./.github/workflows/zed-cargo-rolling-chain.yml
    with:
      base_sha: ${{ inputs.base_sha }}
      head_sha: ${{ inputs.head_sha }}
      source_distance: ${{ inputs.source_distance }}
    secrets: inherit

  publish-source:
    name: Publish the verified Zed source
    needs: benchmark
    if: needs.benchmark.result == 'success'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
      EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          submodules: false
          token: ${{ github.token }}

      - name: Advance the verified source pair
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/advance-source-pair.sh benchmark-source.env ZED check_dependencies "$EXPECTED_HEAD_SHA"
          source benchmark-source.env
          test "$ZED_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$ZED_HEAD_SHA" = "$EXPECTED_HEAD_SHA"

      - name: Pin the verified Zed head
        run: |
          set -euo pipefail
          source benchmark-source.env
          git submodule sync --recursive
          git submodule update --init --checkout upstream
          git -C upstream fetch --no-tags --depth 1 origin "$ZED_HEAD_SHA"
          git -C upstream checkout --detach "$ZED_HEAD_SHA"
          test "$(git -C upstream rev-parse HEAD)" = "$ZED_HEAD_SHA"

      - name: Commit the verified upstream update
        run: |
          set -euo pipefail
          git config user.name "boringcache-bot"
          git config user.email "boringcache-bot@users.noreply.github.com"
          git add benchmark-source.env upstream
          test -n "$(git diff --cached --name-only)"
          git commit -m "Update upstream to ${{ steps.source.outputs.source_repository }}@${{ steps.source.outputs.source_short_sha }}"
          git push origin HEAD:main
