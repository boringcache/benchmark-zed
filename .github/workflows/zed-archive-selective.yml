name: "Zed archive rolling saves"
run-name: ${{ format('Zed archive {0}{2} | three commits | CLI {1}', inputs.archive_format, inputs.cli_artifact_id || inputs.cli_version || 'Action default', inputs.verify && ' verified' || '') }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact immutable BoringCache CLI release tag.
        type: string
        default: ""
      archive_format:
        description: Archive format for every seed and commit save.
        type: choice
        options: [v3, v2]
        default: v3
      cli_artifact_id:
        description: Optional immutable Linux CLI artifact to run instead of a release.
        type: string
        default: ""
      cli_artifact_workspace:
        description: Workspace that owns the optional CLI artifact.
        type: string
        default: boringcache/monolith
      sccache_version:
        description: sccache release the selected CLI requires.
        type: string
        default: v0.17.0
      cargo_target_budget:
        description: Optional --target-budget for the memory-logged build; 0 turns off Cargo pruning observation.
        type: string
        default: ""
      trace_memory:
        description: Diagnose the seed build by running the CLI directly with a memory log every 10 seconds.
        type: boolean
        default: false
      verify:
        description: Also read every selective save in full and fail when the graphs differ.
        type: boolean
        default: false
      head_sha:
        description: Exact final source commit; its three first-parent predecessors form the chain.
        type: string
        default: ""
      runner_label:
        description: Optional runner label for a manual main-branch experiment.
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: archive-rolling-${{ github.workflow }}-${{ inputs.archive_format }}
  cancel-in-progress: false

env:
  BORINGCACHE_ARCHIVE_GRAPH_WRITES: "1"
  BORINGCACHE_ARCHIVE_SELECTIVE_READS: ${{ inputs.archive_format == 'v3' && '1' || '0' }}
  BORINGCACHE_ARCHIVE_SELECTIVE_VERIFY: ${{ inputs.verify && '1' || '0' }}
  CACHE_SCOPE: rolling-${{ inputs.archive_format }}-r${{ github.run_id }}-a${{ github.run_attempt }}
  CARGO_INCREMENTAL: "0"
  ZED_BUNDLE: "true"
  CC: clang
  CXX: clang++

jobs:
  source:
    name: Resolve Zed source chain
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: ubuntu-24.04
    outputs:
      repository: ${{ steps.pin.outputs.repository }}
      seed_parent: ${{ steps.chain.outputs.seed_parent }}
      seed: ${{ steps.chain.outputs.seed }}
      commit1: ${{ steps.chain.outputs.commit1 }}
      commit2: ${{ steps.chain.outputs.commit2 }}
      commit3: ${{ steps.chain.outputs.commit3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the source pin
        id: pin
        env:
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          source cargo-layer-source.env
          source_sha="${INPUT_HEAD_SHA:-$ZED_HEAD_SHA}"
          echo "repository=$ZED_SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "head_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout the source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.head_sha }}
          path: source-chain
          fetch-depth: 5
          persist-credentials: false
      - name: Resolve three first-parent commits
        id: chain
        working-directory: source-chain
        run: |
          set -euo pipefail
          for item in seed_parent:4 seed:3 commit1:2 commit2:1 commit3:0; do
            key="${item%:*}"
            depth="${item#*:}"
            sha="$(git rev-parse "HEAD~$depth")"
            echo "$key=$sha" >> "$GITHUB_OUTPUT"
            echo "$key: $sha" >> "$GITHUB_STEP_SUMMARY"
          done

  seed:
    name: BoringCache Zed seed
    needs: source
    runs-on: ${{ github.ref_name == 'main' && inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 240
    env:
      PHASE: seed
      SOURCE_SHA: ${{ needs.source.outputs.seed }}
      PARENT_SHA: ${{ needs.source.outputs.seed_parent }}
    steps: &build_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the benchmark Python toolchain
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Prepare the source and release toolchain
        run: ./scripts/prepare-zed-lane.sh "$SOURCE_SHA" "$PARENT_SHA"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: ${{ inputs.sccache_version }}

      - name: Require an empty target
        run: test ! -e upstream/target

      - name: Start lane timing
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Scope this archive comparison
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path
          scope = os.environ["CACHE_SCOPE"]
          assert re.fullmatch(r"[a-z0-9-]+", scope)
          for filename in ['plans/archive-selective/primary/.boringcache.toml', 'plans/archive-selective/remote-server/.boringcache.toml']:
              path = Path(filename)
              text, count = re.subn(r'(?m)^(tag = ")([^"]+)(")$', lambda m: m[1] + m[2] + "-" + scope + m[3], path.read_text())
              assert count > 0, filename
              path.write_text(text)
          PYTHON

      - name: Select the primary CLI plan
        run: ./scripts/activate-cargo-plan.sh archive-selective primary

      - name: Require clean source before caching
        run: test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

      - name: Pull the candidate CLI artifact
        if: inputs.cli_artifact_id != ''
        uses: boringcache/one@f0fb9b2d926a32b10c543e92093ba00c5a291b79 # v1 / 1.33.0
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_CLI_ARTIFACT_RESTORE_TOKEN }}
        with:
          cli-version: v1.33.0
          mode: artifact
          artifact-command: pull
          artifact-id: ${{ inputs.cli_artifact_id }}
          artifact-workspace: ${{ inputs.cli_artifact_workspace }}
          artifact-path: ${{ runner.temp }}/candidate-cli
          trust-policy: restore

      - name: Put the candidate CLI on PATH
        if: inputs.cli_artifact_id != ''
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/candidate-cli"
          sha256sum --check boringcache.sha256
          chmod +x boringcache
          echo "${RUNNER_TEMP}/candidate-cli" >> "$GITHUB_PATH"
          ./boringcache --version

      - name: Require a published target before the commit build
        if: env.PHASE != 'seed'
        uses: boringcache/one@f0fb9b2d926a32b10c543e92093ba00c5a291b79 # v1 / 1.33.0
        with:
          cli-version: ${{ inputs.cli_artifact_id != '' && 'skip' || inputs.cli_version }}
          setup: none
          mode: cargo
          lookup-only: true
          fail-on-cache-miss: true
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          RUSTFLAGS: '-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib'

      - name: Build the primary binaries with a memory log
        if: inputs.trace_memory
        working-directory: upstream
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          CLI_ARTIFACT_ID: ${{ inputs.cli_artifact_id }}
          CLI_VERSION: ${{ inputs.cli_version }}
          CARGO_TARGET_BUDGET: ${{ inputs.cargo_target_budget }}
          RUSTFLAGS: '-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib'
        run: |
          set -euo pipefail
          (
            while sleep 10; do
              echo "[memory] $(date -u +%H:%M:%S) $(free -m | awk '/^Mem:/{printf "used=%sMB available=%sMB", $3, $7}') $(free -m | awk '/^Swap:/{printf "swap_used=%sMB", $3}') top: $(ps -eo rss=,comm= --sort=-rss | head -6 | awk '{printf "%s=%dMB ", $2, $1/1024}')"
            done
          ) &
          sampler=$!
          trap 'kill "${sampler}" 2>/dev/null || true' EXIT
          if [[ -z "${CLI_ARTIFACT_ID}" ]]; then
            version="${CLI_VERSION:-1.33.0}"
            version="v${version#v}"
            install -d "${RUNNER_TEMP}/release-cli"
            base="https://github.com/boringcache/cli/releases/download/${version}"
            curl -fsSL --retry 5 -o "${RUNNER_TEMP}/release-cli/boringcache-linux-amd64" "${base}/boringcache-linux-amd64"
            curl -fsSL --retry 5 -o "${RUNNER_TEMP}/release-cli/SHA256SUMS" "${base}/SHA256SUMS"
            (cd "${RUNNER_TEMP}/release-cli" && grep ' boringcache-linux-amd64$' SHA256SUMS | sha256sum --check)
            install -m 0755 "${RUNNER_TEMP}/release-cli/boringcache-linux-amd64" "${RUNNER_TEMP}/release-cli/boringcache"
            export PATH="${RUNNER_TEMP}/release-cli:${PATH}"
          fi
          boringcache --version
          budget=()
          if [[ -n "${CARGO_TARGET_BUDGET}" ]]; then
            budget=(--target-budget "${CARGO_TARGET_BUDGET}")
          fi
          if ! boringcache cargo --workspace boringcache/benchmark-zed --port 22243 --write --fail-on-cache-error "${budget[@]}"; then
            sudo dmesg | grep -iE "killed process|out of memory|oom" | tail -20 || true
            exit 1
          fi

      - name: Build the primary binaries through the combined Cargo plan
        id: primary
        if: ${{ !inputs.trace_memory }}
        uses: boringcache/one@f0fb9b2d926a32b10c543e92093ba00c5a291b79 # v1 / 1.33.0
        with:
          cli-version: ${{ inputs.cli_artifact_id != '' && 'skip' || inputs.cli_version }}
          setup: none
          mode: cargo
          trust-policy: publish
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          RUSTFLAGS: '-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib'

      - name: Select the remote-server CLI plan
        run: ./scripts/activate-cargo-plan.sh archive-selective remote-server

      - name: Build the remote server through the combined Cargo plan
        id: remote
        uses: boringcache/one@f0fb9b2d926a32b10c543e92093ba00c5a291b79 # v1 / 1.33.0
        with:
          cli-version: ${{ inputs.cli_artifact_id != '' && 'skip' || inputs.cli_version }}
          setup: none
          mode: cargo
          trust-policy: publish
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          RUSTFLAGS: '-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib -C target-feature=+crt-static'
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Report build evidence
        run: |
          echo "lane_seconds=$(( $(date +%s) - ${{ steps.timer.outputs.started_at }} ))" >> "$GITHUB_STEP_SUMMARY"
          ./scripts/summarize-cargo-evidence.py \
            "$PHASE-primary" "${{ steps.primary.outputs.evidence-path }}" \
            "$PHASE-remote-server" "${{ steps.remote.outputs.evidence-path }}"

      - name: Verify source remained clean
        run: test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

      - name: Keep archive phase timings
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/archive-phases"
          cat ~/.boringcache/logs/*.jsonl 2>/dev/null \
            | jq -c 'select(.schema == "archive_graph_phase.v1" or .schema == "system_resources.v1")' \
            > "$RUNNER_TEMP/archive-phases/$PHASE.jsonl" || true
          wc -l "$RUNNER_TEMP/archive-phases/$PHASE.jsonl"

      - name: Retain product evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zed-archive-${{ inputs.archive_format }}-${{ env.PHASE }}
          path: |
            ${{ steps.primary.outputs.evidence-path }}
            ${{ steps.remote.outputs.evidence-path }}
            ${{ runner.temp }}/archive-phases/*.jsonl
          if-no-files-found: error

  commit1:
    name: BoringCache Zed commit 1
    needs: [source, seed]
    runs-on: ${{ github.ref_name == 'main' && inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 240
    env:
      PHASE: commit1
      SOURCE_SHA: ${{ needs.source.outputs.commit1 }}
      PARENT_SHA: ${{ needs.source.outputs.seed }}
    steps: *build_steps

  commit2:
    name: BoringCache Zed commit 2
    needs: [source, commit1]
    runs-on: ${{ github.ref_name == 'main' && inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 240
    env:
      PHASE: commit2
      SOURCE_SHA: ${{ needs.source.outputs.commit2 }}
      PARENT_SHA: ${{ needs.source.outputs.commit1 }}
    steps: *build_steps

  commit3:
    name: BoringCache Zed commit 3
    needs: [source, commit2]
    runs-on: ${{ github.ref_name == 'main' && inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 240
    env:
      PHASE: commit3
      SOURCE_SHA: ${{ needs.source.outputs.commit3 }}
      PARENT_SHA: ${{ needs.source.outputs.commit2 }}
    steps: *build_steps
