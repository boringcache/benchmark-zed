name: "Zed Cargo benchmark"
run-name: Zed cargo-rolling-chain | CLI v1.16.4

on:
  push:
    branches:
      - main
    paths:
      - "benchmark-source.env"

permissions:
  actions: read
  contents: read

jobs:
  source:
    name: Read benchmark source
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.source.outputs.ZED_BASE_SHA }}
      head_sha: ${{ steps.source.outputs.ZED_HEAD_SHA }}
      cache_scope: ${{ steps.source.outputs.ZED_ROLLING_CACHE_SCOPE }}
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Read pinned source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

  cargo-rolling-chain:
    name: BoringCache Cargo rolling chain
    needs: source
    uses: ./.github/workflows/zed-cargo-rolling-chain.yml
    with:
      cli_version: v1.16.4
      cache_scope: ${{ needs.source.outputs.cache_scope }}
      base_sha: ${{ needs.source.outputs.base_sha }}
      head_sha: ${{ needs.source.outputs.head_sha }}
    secrets: inherit
