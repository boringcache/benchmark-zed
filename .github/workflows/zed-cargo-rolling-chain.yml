name: "Zed Cargo rolling run"
run-name: ${{ github.event_name == 'push' && 'Zed Cargo rolling pinned source update' || format('Zed Cargo rolling {0} to {1}', inputs.base_sha, inputs.head_sha) }}

on:
  push:
    branches: [main]
    paths: ["benchmark-source.env"]
  workflow_dispatch:
    inputs:
      cli_version:
        description: Exact immutable BoringCache CLI release tag.
        required: false
        type: string
        default: ""
      cache_scope:
        description: Existing rolling scope whose target was published from base_sha.
        required: true
        type: string
      base_sha:
        description: Source commit currently represented by the published target.
        required: true
        type: string
      head_sha:
        description: Immediate child commit to build and publish as the next seed.
        required: true
        type: string
      runner_label:
        description: Optional runner label for a manual main-branch experiment.
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: benchmark-zed-cargo-rolling-chain
  cancel-in-progress: false

jobs:
  source:
    name: Resolve Zed source
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.source.outputs.ZED_BASE_SHA }}
      head_sha: ${{ steps.source.outputs.ZED_HEAD_SHA }}
      cache_scope: ${{ steps.scope.outputs.cache_scope }}
      source_repository: ${{ steps.source.outputs.ZED_SOURCE_REPOSITORY }}
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Name the rolling cohort
        id: scope
        run: |
          set -euo pipefail
          ref_slug="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          ref_slug="${ref_slug#-}"
          ref_slug="${ref_slug%-}"
          ref_slug="${ref_slug:-main}"
          echo "cache_scope=zed-cargo-rolling-${ref_slug}" >> "$GITHUB_OUTPUT"

  advance:
    name: BoringCache Zed Cargo commit
    needs: source
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 240
    env:
      RESOLVED_BASE_SHA: ${{ github.event_name == 'push' && needs.source.outputs.base_sha || inputs.base_sha }}
      RESOLVED_HEAD_SHA: ${{ github.event_name == 'push' && needs.source.outputs.head_sha || inputs.head_sha }}
      RESOLVED_CACHE_SCOPE: ${{ github.event_name == 'push' && needs.source.outputs.cache_scope || inputs.cache_scope }}
    steps:
      - name: Start the workflow timer
        id: workflow_timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Checkout the adjacent Zed head
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 2 --recommend-shallow --jobs 4 upstream
          git -C upstream fetch --no-tags --depth 2 origin "$RESOLVED_HEAD_SHA"
          git -C upstream checkout --detach "$RESOLVED_HEAD_SHA"
          test "$(git -C upstream rev-parse HEAD)" = "$RESOLVED_HEAD_SHA"
          test "$(git -C upstream rev-parse HEAD^)" = "$RESOLVED_BASE_SHA"
          git -C upstream clean -fdx
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libssl-dev pkg-config cmake \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev

      - name: Install Zed's pinned Rust toolchain
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^channel = "\(.*\)"$/\1/p' upstream/rust-toolchain.toml)"
          test -n "$pinned"
          grep -Fxq "ZED_RUST_VERSION=${pinned}" benchmark-source.env
          rustup toolchain install "$pinned" --profile minimal
          rustup default "$pinned"

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Scope the persistent Cargo product chain
        run: ./scripts/scope-boringcache-run.sh "$RESOLVED_CACHE_SCOPE"

      - name: Require an empty destination
        run: test ! -e upstream/target

      - name: Start the build timer
        id: build_timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      
      - name: Run the released Cargo product
        id: cache
        uses: boringcache/one@b372edd91cda127cb03c64967df35c3836d47f2a # v1 / 1.17.0
        with:
          cli-version: ${{ inputs.cli_version }}
          setup: none
          mode: cargo
          trust-policy: publish
          working-directory: upstream
          fail-on-cache-error: true
          metadata-hints: phase=rolling
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}

      - name: Capture the build timing
        id: build_timing
        env:
          BUILD_STARTED_AT: ${{ steps.build_timer.outputs.started_at }}
        run: echo "build_seconds=$(( $(date +%s) - BUILD_STARTED_AT ))" >> "$GITHUB_OUTPUT"
      
      - name: Verify the Zed build
        run: |
          set -euo pipefail
          test -x upstream/target/release/zed
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

      - name: Write the benchmark phase evidence
        env:
          WORKFLOW_STARTED_AT: ${{ steps.workflow_timer.outputs.started_at }}
          BUILD_SECONDS: ${{ steps.build_timing.outputs.build_seconds }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_TAG: ${{ steps.cache.outputs.cache-tag }}
          CACHE_WORKSPACE: ${{ steps.cache.outputs.workspace }}
          EVIDENCE_PATH: ${{ steps.cache.outputs.evidence-path }}
          SOURCE_REPOSITORY: ${{ needs.source.outputs.source_repository }}
          SOURCE_SHA: ${{ env.RESOLVED_HEAD_SHA }}
        run: |
          set -euo pipefail
          python3 ./scripts/benchmark-report.py phase \
            --benchmark zed-cargo \
            --strategy boringcache \
            --lane rolling \
            --phase commit \
            --mode cargo \
            --build-seconds "$BUILD_SECONDS" \
            --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
            --cache-hit "$CACHE_HIT" \
            --cache-tag "$CACHE_TAG" \
            --workspace "$CACHE_WORKSPACE" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --evidence "$EVIDENCE_PATH"
      
      - name: Publish the Zed Cargo rolling benchmark report
        run: |
          python3 ./scripts/benchmark-report.py summarize \
            --title "Zed Cargo rolling benchmark" \
            --input-dir benchmark-results \
            --output-dir benchmark-results
      
      - name: Retain the Zed Cargo rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-zed-cargo-boringcache-rolling
          path: benchmark-results/zed-cargo-boringcache-rolling.json
          if-no-files-found: error
      
      - name: Publish rolling run summary
        run: |
          {
            echo "## Zed Cargo rolling run"
            echo
            echo "- CLI: \`${{ inputs.cli_version }}\`"
            echo "- Source: \`${RESOLVED_BASE_SHA}\` → \`${RESOLVED_HEAD_SHA}\`"
            echo "- Signed target available before the adjacent build: \`${{ steps.cache.outputs.cache-hit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain product evidence
        uses: actions/upload-artifact@v6
        with:
          name: zed-cargo-rolling-${{ env.RESOLVED_HEAD_SHA }}
          path: ${{ steps.cache.outputs.evidence-path }}
          if-no-files-found: error
