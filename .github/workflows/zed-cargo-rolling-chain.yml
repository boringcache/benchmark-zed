name: "Zed Cargo rolling run"
run-name: Zed Cargo rolling ${{ inputs.base_sha }} to ${{ inputs.head_sha }}

on:
  workflow_call:
    inputs:
      cli_version:
        required: false
        type: string
        default: ""
      cache_scope:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      cli_version:
        description: Exact immutable BoringCache CLI release tag.
        required: false
        type: string
        default: ""
      cache_scope:
        description: Existing rolling scope whose target was published from base_sha.
        required: true
        type: string
      base_sha:
        description: Source commit currently represented by the published target.
        required: true
        type: string
      head_sha:
        description: Immediate child commit to build and publish as the next seed.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: benchmark-zed-cargo-rolling-chain
  cancel-in-progress: false

env:
  PROJECT_RUST_VERSION: "1.95.0"

jobs:
  advance:
    name: Restore base and publish adjacent head
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Checkout the adjacent Zed head
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 2 --recommend-shallow --jobs 4 upstream
          git -C upstream fetch --no-tags --depth 2 origin "${{ inputs.head_sha }}"
          git -C upstream checkout --detach "${{ inputs.head_sha }}"
          test "$(git -C upstream rev-parse HEAD)" = "${{ inputs.head_sha }}"
          test "$(git -C upstream rev-parse HEAD^)" = "${{ inputs.base_sha }}"
          git -C upstream clean -fdx
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libssl-dev pkg-config cmake \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$PROJECT_RUST_VERSION" --profile minimal
          rustup default "$PROJECT_RUST_VERSION"

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Scope the persistent Cargo product chain
        run: ./scripts/scope-boringcache-run.sh "${{ inputs.cache_scope }}"

      - name: Require an empty destination
        run: test ! -e upstream/target

      - name: Run the released Cargo product
        id: cache
        uses: boringcache/one@09e053620cda4d3472f26a3ddd181144a108e2c2 # v1.16.8
        with:
          cli-version: ${{ inputs.cli_version }}
          setup: none
          mode: cargo
          trust-policy: publish
          working-directory: upstream
          fail-on-cache-error: true
          metadata-hints: phase=rolling
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}

      - name: Verify the Zed build
        run: |
          set -euo pipefail
          test -x upstream/target/release/zed
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

      - name: Publish rolling run summary
        run: |
          {
            echo "## Zed Cargo rolling run"
            echo
            echo "- CLI: \`${{ inputs.cli_version }}\`"
            echo "- Source: \`${{ inputs.base_sha }}\` → \`${{ inputs.head_sha }}\`"
            echo "- Signed target available before the adjacent build: \`${{ steps.cache.outputs.cache-hit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain product evidence
        uses: actions/upload-artifact@v6
        with:
          name: zed-cargo-rolling-${{ inputs.head_sha }}
          path: ${{ steps.cache.outputs.evidence-path }}
          if-no-files-found: error
