name: "Zed Cargo rolling chain"
run-name: Zed Cargo rolling ${{ inputs.base_sha }} to ${{ inputs.head_sha }}

on:
  workflow_call:
    inputs:
      cli_version:
        required: true
        type: string
      cache_scope:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      cli_version:
        description: Exact immutable BoringCache CLI release tag.
        required: true
        type: string
        default: v1.16.4
      cache_scope:
        description: Existing rolling scope whose target was published from base_sha.
        required: true
        type: string
      base_sha:
        description: Source commit currently represented by the published target.
        required: true
        type: string
      head_sha:
        description: Immediate child commit to build and publish as the next seed.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: benchmark-zed-cargo-rolling-chain
  cancel-in-progress: false

env:
  BENCHMARK_WORKSPACE: boringcache/benchmark-zed
  PROJECT_RUST_VERSION: "1.95.0"

jobs:
  advance:
    name: Restore published base and promote adjacent head
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Validate BoringCache secrets
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
        run: |
          [[ -n "$BORINGCACHE_RESTORE_TOKEN" ]] || { echo "Missing BoringCache restore token" >&2; exit 1; }
          [[ -n "$BORINGCACHE_SAVE_TOKEN" ]] || { echo "Missing BoringCache save token" >&2; exit 1; }

      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Checkout the adjacent Zed head
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 2 --recommend-shallow --jobs 4 upstream
          git -C upstream fetch --no-tags --depth 2 origin "${{ inputs.head_sha }}"
          git -C upstream checkout --detach "${{ inputs.head_sha }}"
          test "$(git -C upstream rev-parse HEAD)" = "${{ inputs.head_sha }}"
          test "$(git -C upstream rev-parse HEAD^)" = "${{ inputs.base_sha }}"
          git -C upstream clean -fdx
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libssl-dev pkg-config cmake \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev

      - name: Install the exact released BoringCache CLI
        run: ./scripts/install-boringcache-cli.sh "${{ inputs.cli_version }}" linux-amd64

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$PROJECT_RUST_VERSION" --profile minimal
          rustup default "$PROJECT_RUST_VERSION"

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Install exact sccache
        run: ./scripts/install-sccache.sh --version 0.16.0

      - name: Scope the persistent Cargo product chain
        run: ./scripts/scope-boringcache-run.sh "${{ inputs.cache_scope }}"

      - name: Require the published base target and an empty destination
        id: base
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          set -euo pipefail
          test ! -e upstream/target
          boringcache check "$BENCHMARK_WORKSPACE" "${{ inputs.cache_scope }}-target" --no-git --json \
            | tee /tmp/zed-chain-base-check.json
          target_tag="$(jq -r '.results[] | select(.status == "hit") | .tag' /tmp/zed-chain-base-check.json)"
          [[ -n "$target_tag" ]] || { echo "Published base target did not resolve" >&2; exit 1; }
          boringcache inspect "$BENCHMARK_WORKSPACE" "$target_tag" --json \
            | tee /tmp/zed-chain-base-inspect.json
          jq -e '.entry.status == "ready" and .entry.server_signed and (.entry.storage_mode == "archive" or (.entry.storage_mode == "cas" and .entry.storage_verified))' \
            /tmp/zed-chain-base-inspect.json
          echo "entry_id=$(jq -r '.entry.id' /tmp/zed-chain-base-inspect.json)" >> "$GITHUB_OUTPUT"

      - name: Restore, build, and publish the adjacent head through boringcache cargo
        id: build
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          (
            cd upstream
            boringcache cargo \
              --write \
              --fail-on-cache-error \
              --metadata-hint phase=rolling-chain \
              --native-tool-evidence-json /tmp/zed-chain-sccache.json \
              build --release --locked --message-format=json-render-diagnostics
          ) > >(tee /tmp/zed-chain-cargo.jsonl) 2> >(tee /tmp/zed-chain-cli.log >&2)
          echo "elapsed_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo correctness, cache health, and head promotion
        id: proof
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          set -euo pipefail
          test -x upstream/target/release/zed
          test -s upstream/target/.boringcache/cargo-freshness-v2.json
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

          boringcache check "$BENCHMARK_WORKSPACE" "${{ inputs.cache_scope }}-target" --no-git --json \
            | tee /tmp/zed-chain-head-check.json
          target_tag="$(jq -r '.results[] | select(.status == "hit") | .tag' /tmp/zed-chain-head-check.json)"
          boringcache inspect "$BENCHMARK_WORKSPACE" "$target_tag" --json \
            | tee /tmp/zed-chain-head-inspect.json
          jq -e '.entry.status == "ready" and .entry.server_signed and (.entry.storage_mode == "archive" or (.entry.storage_mode == "cas" and .entry.storage_verified))' \
            /tmp/zed-chain-head-inspect.json
          test "$(jq -r '.entry.id' /tmp/zed-chain-head-inspect.json)" != "${{ steps.base.outputs.entry_id }}"

          counts="$(sed -nE 's/.*restored: ([0-9,]+) unchanged, ([0-9,]+) changed\/new;.*/\1 \2/p' /tmp/zed-chain-cli.log | tail -n 1)"
          read -r unchanged changed <<< "${counts//,/}"
          fresh="$(jq -s '[.[] | select(.reason == "compiler-artifact" and .fresh == true)] | length' /tmp/zed-chain-cargo.jsonl)"
          rebuilt="$(jq -s '[.[] | select(.reason == "compiler-artifact" and .fresh == false)] | length' /tmp/zed-chain-cargo.jsonl)"

          jq -e --argjson rebuilt "$rebuilt" '
            .tool == "sccache" and
            (.cache_errors // 0) == 0 and
            (.cache_read_errors // 0) == 0 and
            (.cache_write_errors // 0) == 0 and
            (.cache_timeouts // 0) == 0 and
            (
              $rebuilt == 0 or
              (
                (.compile_requests // 0) > 0 and
                ((.cache_hits // 0) + (.cache_misses // 0)) > 0
              )
            )
          ' /tmp/zed-chain-sccache.json

          # An adjacent docs or settings-only commit may correctly rebuild
          # nothing. Changed source identity and a new signed entry prove promotion.
          [[ "${unchanged:-0}" -gt 0 ]]
          [[ "${changed:-0}" -gt 0 ]]
          [[ "$fresh" -gt 0 ]]
          {
            echo "unchanged=${unchanged}"
            echo "changed=${changed}"
            echo "fresh=${fresh}"
            echo "rebuilt=${rebuilt}"
          } >> "$GITHUB_OUTPUT"

      - name: Record target accumulation
        id: target_growth
        run: |
          set -euo pipefail
          jq -n \
            --slurpfile base /tmp/zed-chain-base-inspect.json \
            --slurpfile head /tmp/zed-chain-head-inspect.json '
              def stored_bytes:
                .stored_size_bytes // .compressed_size // .blob_total_size_bytes;
              def layout_id:
                [
                  .storage_mode,
                  .cas_layout,
                  .compression_algorithm,
                  (if .manifest_format_version == null then null
                   else "manifest-v\(.manifest_format_version)" end)
                ] | map(select(. != null)) | join(":");
              ($base[0].entry) as $before |
              ($head[0].entry) as $after |
              (($before | layout_id) == ($after | layout_id)) as $comparable |
              {
                schema_version: "cargo_target_growth.v1",
                comparable: $comparable,
                reason: (if $comparable then null else "storage_layout_changed" end),
                base: {
                  entry_id: $before.id,
                  layout: ($before | layout_id),
                  storage_mode: $before.storage_mode,
                  cas_layout: ($before.cas_layout // null),
                  compression_algorithm: ($before.compression_algorithm // null),
                  manifest_format_version: ($before.manifest_format_version // null),
                  stored_size_bytes: ($before | stored_bytes),
                  uncompressed_size_bytes: ($before.uncompressed_size // null)
                },
                head: {
                  entry_id: $after.id,
                  layout: ($after | layout_id),
                  storage_mode: $after.storage_mode,
                  cas_layout: ($after.cas_layout // null),
                  compression_algorithm: ($after.compression_algorithm // null),
                  manifest_format_version: ($after.manifest_format_version // null),
                  stored_size_bytes: ($after | stored_bytes),
                  uncompressed_size_bytes: ($after.uncompressed_size // null)
                },
                stored_size_bytes_delta: (
                  if $comparable and (($before | stored_bytes) != null) and (($after | stored_bytes) != null)
                  then ($after | stored_bytes) - ($before | stored_bytes)
                  else null end
                ),
                uncompressed_size_bytes_delta: (
                  if $comparable and ($before.uncompressed_size != null) and ($after.uncompressed_size != null)
                  then $after.uncompressed_size - $before.uncompressed_size
                  else null end
                )
              }
            ' | tee /tmp/zed-chain-target-growth.json

          jq -e '.schema_version == "cargo_target_growth.v1"' /tmp/zed-chain-target-growth.json
          {
            echo "comparable=$(jq -r '.comparable' /tmp/zed-chain-target-growth.json)"
            echo "layout=$(jq -r '.head.layout' /tmp/zed-chain-target-growth.json)"
            echo "stored_before=$(jq -r '.base.stored_size_bytes // "unavailable"' /tmp/zed-chain-target-growth.json)"
            echo "stored_after=$(jq -r '.head.stored_size_bytes // "unavailable"' /tmp/zed-chain-target-growth.json)"
            echo "stored_delta=$(jq -r '.stored_size_bytes_delta // "not-comparable"' /tmp/zed-chain-target-growth.json)"
            echo "uncompressed_before=$(jq -r '.base.uncompressed_size_bytes // "unavailable"' /tmp/zed-chain-target-growth.json)"
            echo "uncompressed_after=$(jq -r '.head.uncompressed_size_bytes // "unavailable"' /tmp/zed-chain-target-growth.json)"
            echo "uncompressed_delta=$(jq -r '.uncompressed_size_bytes_delta // "unavailable"' /tmp/zed-chain-target-growth.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish rolling cadence summary
        run: |
          {
            echo "## Zed Cargo rolling cadence"
            echo
            echo "- CLI: \`${{ inputs.cli_version }}\`"
            echo "- Source: \`${{ inputs.base_sha }}\` → \`${{ inputs.head_sha }}\`"
            echo "- End to end: ${{ steps.build.outputs.elapsed_seconds }}s"
            echo "- Source freshness: ${{ steps.proof.outputs.unchanged }} unchanged, ${{ steps.proof.outputs.changed }} changed/new"
            echo "- Cargo artifacts: ${{ steps.proof.outputs.fresh }} fresh, ${{ steps.proof.outputs.rebuilt }} rebuilt"
            echo "- Target layout: ${{ steps.target_growth.outputs.layout }} (comparable=${{ steps.target_growth.outputs.comparable }})"
            echo "- Target stored bytes: ${{ steps.target_growth.outputs.stored_before }} → ${{ steps.target_growth.outputs.stored_after }} (delta ${{ steps.target_growth.outputs.stored_delta }})"
            echo "- Target uncompressed bytes: ${{ steps.target_growth.outputs.uncompressed_before }} → ${{ steps.target_growth.outputs.uncompressed_after }} (delta ${{ steps.target_growth.outputs.uncompressed_delta }})"
            echo "- The authenticated target selected by the released CLI was advanced in place and is the next rolling seed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rolling evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zed-cargo-rolling-${{ inputs.head_sha }}
          path: |
            /tmp/zed-chain-*.json
            /tmp/zed-chain-*.jsonl
            /tmp/zed-chain-*.log
          if-no-files-found: error
