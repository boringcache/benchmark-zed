name: "Zed Cargo rolling run"
run-name: ${{ format('Zed Cargo rolling {0} to {1}', inputs.base_sha, inputs.head_sha) }}

on:
  workflow_call:
    inputs:
      cli_version:
        description: Optional exact immutable BoringCache CLI release tag.
        required: false
        type: string
        default: ""
      base_sha:
        description: Source commit currently represented by the published target.
        required: true
        type: string
      head_sha:
        description: Dependency-verified descendant to build and publish as the next seed.
        required: true
        type: string
      source_distance:
        description: Number of first-parent commits from the published seed to the selected source; 0 replays it manually.
        required: false
        type: string
        default: "1"
      runner_label:
        description: Optional runner label for a manual main-branch experiment.
        required: false
        type: string
        default: ""
    secrets:
      BORINGCACHE_RESTORE_TOKEN:
        required: true
      BORINGCACHE_SAVE_TOKEN:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  source:
    name: Resolve Zed source
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.source.outputs.ZED_BASE_SHA }}
      head_sha: ${{ steps.source.outputs.ZED_HEAD_SHA }}
      source_repository: ${{ steps.source.outputs.ZED_SOURCE_REPOSITORY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Read pinned source
        id: source
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          source benchmark-source.env
          test "$INPUT_BASE_SHA" = "$ZED_HEAD_SHA"
          sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

  advance:
    name: BoringCache Zed Cargo commit
    needs: source
    runs-on: ${{ inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 240
    env:
      RESOLVED_BASE_SHA: ${{ inputs.base_sha }}
      RESOLVED_HEAD_SHA: ${{ inputs.head_sha }}
      RESOLVED_SOURCE_DISTANCE: ${{ inputs.source_distance }}
    steps:
      - name: Start the workflow timer
        id: workflow_timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      
      - name: Checkout benchmark repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Use the benchmark Python toolchain
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Checkout the selected Zed source
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 2 --recommend-shallow --jobs 4 upstream
          test "$(git -C upstream rev-parse HEAD)" = "$RESOLVED_BASE_SHA"
          if [[ ! "$RESOLVED_SOURCE_DISTANCE" =~ ^[0-9]+$ ]]; then
            echo "Invalid source distance: $RESOLVED_SOURCE_DISTANCE" >&2
            exit 1
          fi
          fetch_depth=$((RESOLVED_SOURCE_DISTANCE + 1))
          git -C upstream fetch --no-tags --depth "$fetch_depth" origin "$RESOLVED_HEAD_SHA"
          git -C upstream checkout --detach "$RESOLVED_HEAD_SHA"
          test "$(git -C upstream rev-parse HEAD)" = "$RESOLVED_HEAD_SHA"
          git -C upstream merge-base --is-ancestor "$RESOLVED_BASE_SHA" "$RESOLVED_HEAD_SHA"
          test "$(git -C upstream rev-list --count "${RESOLVED_BASE_SHA}..${RESOLVED_HEAD_SHA}")" = "$RESOLVED_SOURCE_DISTANCE"
          git -C upstream clean -fdx
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

      - name: Install Zed's release toolchain
        run: ./scripts/install-zed-toolchain.sh

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Require an empty destination
        run: test ! -e upstream/target

      - name: Start the build timer
        id: build_timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      
      - name: Run the released Cargo product
        id: cache
        uses: boringcache/one@20202f4c4b789cdee581ae3f117dfafb8293b19c # v1 / 1.20.0
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: cargo
          trust-policy: publish
          working-directory: upstream
          fail-on-cache-error: true
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}

      - name: Capture the build timing
        id: build_timing
        env:
          BUILD_STARTED_AT: ${{ steps.build_timer.outputs.started_at }}
        run: echo "build_seconds=$(( $(date +%s) - BUILD_STARTED_AT ))" >> "$GITHUB_OUTPUT"
      
      - name: Verify the Zed build
        run: |
          set -euo pipefail
          test -x upstream/target/release/zed
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

      - name: Write the benchmark phase evidence
        env:
          WORKFLOW_STARTED_AT: ${{ steps.workflow_timer.outputs.started_at }}
          BUILD_SECONDS: ${{ steps.build_timing.outputs.build_seconds }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          EVIDENCE_PATH: ${{ steps.cache.outputs.evidence-path }}
          SOURCE_REPOSITORY: ${{ needs.source.outputs.source_repository }}
          SOURCE_SHA: ${{ env.RESOLVED_HEAD_SHA }}
        run: |
          set -euo pipefail
          python3 ./scripts/benchmark-report.py phase \
            --benchmark zed-cargo \
            --strategy boringcache \
            --lane rolling \
            --phase commit \
            --mode cargo \
            --build-seconds "$BUILD_SECONDS" \
            --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
            --cache-hit "$CACHE_HIT" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --evidence "$EVIDENCE_PATH"
      
      - name: Publish the Zed Cargo rolling benchmark report
        run: |
          python3 ./scripts/benchmark-report.py summarize \
            --title "Zed Cargo rolling benchmark" \
            --input-dir benchmark-results \
            --output-dir benchmark-results
      
      - name: Retain the Zed Cargo rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-zed-cargo-boringcache-rolling
          path: benchmark-results/zed-cargo-boringcache-rolling.json
          if-no-files-found: error
      
      - name: Publish rolling run summary
        run: |
          {
            echo "## Zed Cargo rolling run"
            echo
            echo "- CLI: \`${{ inputs.cli_version }}\`"
            echo "- Source: \`${RESOLVED_BASE_SHA}\` → \`${RESOLVED_HEAD_SHA}\`"
            echo "- Commit distance: \`${RESOLVED_SOURCE_DISTANCE}\`"
            echo "- Signed target available before the source build: \`${{ steps.cache.outputs.cache-hit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain product evidence
        uses: actions/upload-artifact@v6
        with:
          name: zed-cargo-rolling-${{ env.RESOLVED_HEAD_SHA }}
          path: ${{ steps.cache.outputs.evidence-path }}
          if-no-files-found: error
