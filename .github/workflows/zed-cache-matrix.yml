name: "Zed Cargo cache matrix"
run-name: "Zed Cargo cache matrix"

# One cold seed, then every cache strategy runs against it CONCURRENTLY. The
# lanes differ only in how build state is carried between the seed and the head
# build, so subtracting them decomposes the gap:
#
#   lane-a  Actions target,     no sccache      baseline
#   lane-b  Actions target,     BoringCache sccache
#   lane-c  BoringCache target, BoringCache sccache
#   lane-d  no target,          BoringCache sccache
#
#   b - a = cost of sccache with transport held identical
#   c - b = cost of BoringCache transport with sccache held identical
#   d     = the sccache-alone shape, for comparison with benchmark-deno
#
# The seed publishes the SAME finished tree to both transports, so lanes a/b and
# lane c restore identical bytes. Lanes that can observe the restored tree before
# Cargo touches it emit a manifest and diff it against the seed's, which is what
# turns "the cache restored" into "the cache restored exactly".

on:
  push:
    branches: ["claude/zed-deno-benchmark-compare-w2u0d8"]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Seed commit. Defaults to benchmark-source.env.
        required: false
        type: string
        default: ""
      head_sha:
        description: Commit built by every lane. Defaults to benchmark-source.env.
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: read

concurrency:
  group: benchmark-zed-cache-matrix
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  ZED_BUNDLE: "true"
  CC: clang

jobs:
  source:
    name: Resolve Zed source
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.pick.outputs.base_sha }}
      head_sha: ${{ steps.pick.outputs.head_sha }}
      cache_key: ${{ steps.pick.outputs.cache_key }}
      scope: ${{ steps.pick.outputs.scope }}
    steps:
      - uses: actions/checkout@v6
      - id: pick
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          sed '/^$/d' benchmark-source.env > /tmp/source.env
          . /tmp/source.env
          base="${INPUT_BASE_SHA:-$ZED_BASE_SHA}"
          head="${INPUT_HEAD_SHA:-$ZED_HEAD_SHA}"
          {
            echo "base_sha=${base}"
            echo "head_sha=${head}"
            echo "cache_key=zed-matrix-${{ github.run_id }}-${base}"
            echo "scope=zed-matrix-r${{ github.run_id }}-a${{ github.run_attempt }}"
          } >> "$GITHUB_OUTPUT"

  seed:
    name: Seed both transports
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/prepare-zed-lane.sh "${{ needs.source.outputs.base_sha }}"
      - run: ./scripts/scope-boringcache-run.sh "${{ needs.source.outputs.scope }}"
      - run: test ! -e upstream/target

      - name: Build the seed through the Cargo product
        uses: boringcache/one@78e1fd3257bbdf27722c46b500a39b6626fc8d27 # v1 / 1.18.0
        with:
          setup: none
          mode: cargo
          trust-policy: publish
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
          metadata-hints: phase=matrix-seed-primary
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          RUSTFLAGS: -C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib

      - run: ./scripts/select-zed-cargo-phase.py remote-server
      - name: Build remote_server through the Cargo product
        uses: boringcache/one@78e1fd3257bbdf27722c46b500a39b6626fc8d27 # v1 / 1.18.0
        with:
          setup: none
          mode: cargo
          trust-policy: publish
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
          metadata-hints: phase=matrix-seed-remote-server
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          RUSTFLAGS: -C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib -C target-feature=+crt-static
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Manifest the finished seed tree
        run: ./scripts/tree-manifest.py emit upstream/target /tmp/seed-manifest.json

      - uses: actions/upload-artifact@v6
        with:
          name: seed-manifest
          path: /tmp/seed-manifest.json
          if-no-files-found: error

      # The same finished tree goes to actions/cache, so lanes a/b restore the
      # exact bytes lane c restores from BoringCache.
      - name: Publish the same tree to actions/cache
        uses: actions/cache/save@v4
        with:
          key: ${{ needs.source.outputs.cache_key }}
          path: |
            upstream/target
            ~/.cargo/registry
            ~/.cargo/git

  lane-a:
    name: "a: Actions target, no sccache"
    needs: [source, seed]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/prepare-zed-lane.sh "${{ needs.source.outputs.head_sha }}" "${{ needs.source.outputs.base_sha }}"
      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.source.outputs.cache_key }}
          path: |
            upstream/target
            ~/.cargo/registry
            ~/.cargo/git
      - uses: actions/download-artifact@v6
        with: { name: seed-manifest, path: /tmp/seed }
      - name: Check the restored target is exact
        continue-on-error: true
        run: |
          set -euo pipefail
          ./scripts/tree-manifest.py emit upstream/target /tmp/restored.json
          ./scripts/tree-manifest.py compare /tmp/seed/seed-manifest.json /tmp/restored.json
      - id: t
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - run: ./scripts/run-zed-release-phases.sh
      - run: echo "lane-a build_seconds=$(( $(date +%s) - ${{ steps.t.outputs.at }} ))" | tee -a "$GITHUB_STEP_SUMMARY"

  lane-b:
    name: "b: Actions target + BoringCache sccache"
    needs: [source, seed]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/prepare-zed-lane.sh "${{ needs.source.outputs.head_sha }}" "${{ needs.source.outputs.base_sha }}"
      - run: ./scripts/scope-boringcache-run.sh "${{ needs.source.outputs.scope }}"
      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.source.outputs.cache_key }}
          path: |
            upstream/target
            ~/.cargo/registry
            ~/.cargo/git
      - name: Start BoringCache sccache only
        uses: boringcache/one@78e1fd3257bbdf27722c46b500a39b6626fc8d27 # v1 / 1.18.0
        with:
          setup: none
          mode: sccache
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
          metadata-hints: phase=matrix-lane-b
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ""
      - id: t
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - run: ./scripts/run-zed-release-phases.sh
      - run: echo "lane-b build_seconds=$(( $(date +%s) - ${{ steps.t.outputs.at }} ))" | tee -a "$GITHUB_STEP_SUMMARY"

  lane-c:
    name: "c: BoringCache target + sccache"
    needs: [source, seed]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/prepare-zed-lane.sh "${{ needs.source.outputs.head_sha }}" "${{ needs.source.outputs.base_sha }}"
      - run: ./scripts/scope-boringcache-run.sh "${{ needs.source.outputs.scope }}"
      - run: test ! -e upstream/target

      # The previous attempt used a `cargo --version` probe to see the restored
      # tree before Cargo touched it. The adapter does not restore the
      # cargo-target entry for a non-build command, so only registry and git came
      # back and the lane silently ran cold. Let the real build drive the restore.
      - name: Build primary with BoringCache target + sccache
        id: primary
        uses: boringcache/one@78e1fd3257bbdf27722c46b500a39b6626fc8d27 # v1 / 1.18.0
        with:
          setup: none
          mode: cargo
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
          metadata-hints: phase=matrix-lane-c-primary
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ""
          RUSTFLAGS: -C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib

      - name: Confirm the target actually restored
        run: |
          set -euo pipefail
          test -d upstream/target/x86_64-unknown-linux-gnu/release
          du -sh upstream/target | tee -a "$GITHUB_STEP_SUMMARY"

      - run: ./scripts/select-zed-cargo-phase.py remote-server
      - name: Build remote_server with BoringCache target + sccache
        uses: boringcache/one@78e1fd3257bbdf27722c46b500a39b6626fc8d27 # v1 / 1.18.0
        with:
          setup: none
          mode: cargo
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
          metadata-hints: phase=matrix-lane-c-remote-server
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ""
          RUSTFLAGS: -C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib -C target-feature=+crt-static
          CC_x86_64_unknown_linux_musl: musl-gcc

  lane-d:
    name: "d: sccache only, no target"
    needs: [source, seed]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/prepare-zed-lane.sh "${{ needs.source.outputs.head_sha }}" "${{ needs.source.outputs.base_sha }}"
      - run: ./scripts/scope-boringcache-run.sh "${{ needs.source.outputs.scope }}"
      - name: Drop the target entry from the profile
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import pathlib, re
          p = pathlib.Path(".boringcache.toml")
          s = p.read_text()
          s = re.sub(r'entries = \["cargo-registry", "cargo-git", "zed-target"\]',
                     'entries = ["cargo-registry", "cargo-git"]', s)
          p.write_text(s)
          EOF
          grep -A1 'profiles.cargo-product' .boringcache.toml
      - run: test ! -e upstream/target
      # mode sccache restores no archives, so this lane uses mode cargo with the
      # target dropped from the profile: registry and git still restore, the
      # target does not. Using mode sccache here would re-download every
      # dependency and read as an sccache failure.
      - id: t
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build primary with sccache but no target
        uses: boringcache/one@78e1fd3257bbdf27722c46b500a39b6626fc8d27 # v1 / 1.18.0
        with:
          setup: none
          mode: cargo
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
          metadata-hints: phase=matrix-lane-d-primary
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ""
          RUSTFLAGS: -C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib
      - run: ./scripts/select-zed-cargo-phase.py remote-server
      - name: Build remote_server with sccache but no target
        uses: boringcache/one@78e1fd3257bbdf27722c46b500a39b6626fc8d27 # v1 / 1.18.0
        with:
          setup: none
          mode: cargo
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
          metadata-hints: phase=matrix-lane-d-remote-server
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ""
          RUSTFLAGS: -C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib -C target-feature=+crt-static
          CC_x86_64_unknown_linux_musl: musl-gcc
      - run: echo "lane-d build_seconds=$(( $(date +%s) - ${{ steps.t.outputs.at }} ))" | tee -a "$GITHUB_STEP_SUMMARY"
