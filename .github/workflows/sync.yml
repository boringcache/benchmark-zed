name: "Sync Upstream"

on:
  workflow_dispatch:
  schedule:
    - cron: "28,58 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: benchmark-zed-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync With Upstream
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ github.token }}

      - name: Advance the adjacent source pair
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/advance-source-pair.sh benchmark-source.env ZED

      - name: Pin the adjacent Zed head
        run: |
          set -euo pipefail
          source benchmark-source.env
          git submodule sync --recursive
          git submodule update --init --checkout upstream
          git -C upstream fetch --no-tags --depth 1 origin "$ZED_HEAD_SHA"
          git -C upstream checkout --detach "$ZED_HEAD_SHA"
          test "$(git -C upstream rev-parse HEAD)" = "$ZED_HEAD_SHA"

      - name: Commit the upstream update
        id: sync
        run: |
          set -euo pipefail
          echo "updated=false" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- benchmark-source.env upstream; then
            echo "No upstream changes"
            exit 0
          fi

          git config user.name "boringcache-bot"
          git config user.email "boringcache-bot@users.noreply.github.com"
          git add benchmark-source.env upstream
          git commit -m "Update upstream to ${{ steps.source.outputs.source_repository }}@${{ steps.source.outputs.source_short_sha }}"
          git push origin HEAD:main
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch rolling benchmark
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source benchmark-source.env
          gh workflow run zed-cargo-rolling-chain.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "base_sha=${ZED_BASE_SHA}" \
            -f "head_sha=${ZED_HEAD_SHA}"
