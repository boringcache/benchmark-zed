name: "Sync Upstream"

on:
  workflow_dispatch:
  schedule:
    - cron: "28,58 * * * *"

permissions:
  actions: write
  checks: read
  contents: read

concurrency:
  # Serialize source selection with the dispatched build. The build advances
  # the source pin only after it succeeds.
  group: benchmark-zed-cargo-rolling-chain
  cancel-in-progress: false

jobs:
  source:
    name: Select next Zed source
    runs-on: ubuntu-24.04
    outputs:
      updated: ${{ steps.source.outputs.updated }}
      base_sha: ${{ steps.source.outputs.base_sha }}
      head_sha: ${{ steps.source.outputs.head_sha }}
      source_distance: ${{ steps.source.outputs.source_distance }}
      intermediate_source_count: ${{ steps.source.outputs.intermediate_source_count }}
      deferred_source_count: ${{ steps.source.outputs.deferred_source_count }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          submodules: false
          token: ${{ github.token }}

      - name: Select the newest dependency-verified source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/advance-source-pair.sh benchmark-source.env ZED check_dependencies

      - name: Summarize source selection
        if: steps.source.outputs.updated == 'true'
        env:
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_DISTANCE: ${{ steps.source.outputs.source_distance }}
          INTERMEDIATE_SOURCE_COUNT: ${{ steps.source.outputs.intermediate_source_count }}
          DEFERRED_SOURCE_COUNT: ${{ steps.source.outputs.deferred_source_count }}
        run: |
          {
            echo "## Zed source selection"
            echo
            echo "- Source: \`${BASE_SHA}\` → \`${HEAD_SHA}\`"
            echo "- Commit distance: \`${SOURCE_DISTANCE}\`"
            echo "- Intermediate commits included in this build: \`${INTERMEDIATE_SOURCE_COUNT}\`"
            echo "- Newer commits awaiting a successful dependency check: \`${DEFERRED_SOURCE_COUNT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch:
    name: Dispatch the next dependency-verified Zed source
    needs: source
    if: needs.source.outputs.updated == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ needs.source.outputs.base_sha }}
      HEAD_SHA: ${{ needs.source.outputs.head_sha }}
      SOURCE_DISTANCE: ${{ needs.source.outputs.source_distance }}
    steps:
      - name: Dispatch the rolling build
        run: |
          set -euo pipefail
          gh workflow run zed-cargo-rolling-auto.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "base_sha=${BASE_SHA}" \
            -f "head_sha=${HEAD_SHA}" \
            -f "source_distance=${SOURCE_DISTANCE}"
