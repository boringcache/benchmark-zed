name: "Canary Benchmark"
run-name: ${{ format('Canary | CLI {0}', inputs.cli_version || 'latest immutable') }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "Exact BoringCache CLI release tag."
        required: false
        type: string
        default: "v1.16.4"
      cargo_product:
        description: "Run the CLI-owned Cargo target + sccache + freshness proof. Retained for release-dispatch compatibility."
        required: false
        type: boolean
        default: true
      archive_chunks_v2:
        description: "Require guarded archive-chunks-v2 mutation reuse in the Cargo product proof."
        required: false
        type: boolean
        default: false
      cargo_rolling_chain:
        description: "Advance an existing CLI-owned Cargo target by one adjacent commit."
        required: false
        type: boolean
        default: false
      cache_scope:
        description: "Existing Cargo rolling scope; required by cargo_rolling_chain."
        required: false
        type: string
        default: ""
      base_sha:
        description: "Commit represented by the published target."
        required: false
        type: string
        default: ""
      head_sha:
        description: "Immediate child to build and publish."
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  cargo-product:
    name: Run Zed Cargo product proof
    if: ${{ !inputs.cargo_rolling_chain }}
    uses: ./.github/workflows/zed-cargo-product.yml
    with:
      cli_version: ${{ inputs.cli_version }}
      archive_chunks_v2: ${{ inputs.archive_chunks_v2 }}
    secrets: inherit

  cargo-rolling-chain:
    name: Run Zed Cargo rolling chain
    if: ${{ inputs.cargo_rolling_chain }}
    uses: ./.github/workflows/zed-cargo-rolling-chain.yml
    with:
      cli_version: ${{ inputs.cli_version }}
      cache_scope: ${{ inputs.cache_scope }}
      base_sha: ${{ inputs.base_sha }}
      head_sha: ${{ inputs.head_sha }}
    secrets: inherit
