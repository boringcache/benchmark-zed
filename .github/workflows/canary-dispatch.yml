name: "Canary Benchmark"
run-name: ${{ format('Canary | CLI {0}', inputs.cli_version || 'latest immutable') }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "Exact BoringCache CLI release tag."
        required: false
        type: string
        default: "v1.16.3"
      cargo_product:
        description: "Run the CLI-owned Cargo target + sccache + freshness proof."
        required: false
        type: boolean
        default: false
      cargo_rolling_chain:
        description: "Advance an existing CLI-owned Cargo target by one adjacent commit."
        required: false
        type: boolean
        default: false
      cache_scope:
        description: "Existing Cargo rolling scope; required by cargo_rolling_chain."
        required: false
        type: string
        default: ""
      base_sha:
        description: "Commit represented by the published target."
        required: false
        type: string
        default: ""
      head_sha:
        description: "Immediate child to build and publish."
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Run Zed canary
    if: ${{ !inputs.cargo_product && !inputs.cargo_rolling_chain }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch isolated fresh benchmark
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          set -euo pipefail

          if [[ -z "$CLI_VERSION" ]]; then
            echo "::error::An exact BoringCache CLI release is required."
            exit 1
          fi

          RUN_URL="$(gh workflow run zed-sccache-fresh-benchmark.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.ref_name }}" \
            -f "cli_version=${CLI_VERSION}")"
          RUN_ID="${RUN_URL##*/}"
          echo "Canary benchmark: ${RUN_URL}"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

  cargo-product:
    name: Run Zed Cargo product proof
    if: ${{ inputs.cargo_product }}
    uses: ./.github/workflows/zed-cargo-product.yml
    with:
      cli_version: ${{ inputs.cli_version }}
    secrets: inherit

  cargo-rolling-chain:
    name: Run Zed Cargo rolling chain
    if: ${{ inputs.cargo_rolling_chain }}
    uses: ./.github/workflows/zed-cargo-rolling-chain.yml
    with:
      cli_version: ${{ inputs.cli_version }}
      cache_scope: ${{ inputs.cache_scope }}
      base_sha: ${{ inputs.base_sha }}
      head_sha: ${{ inputs.head_sha }}
    secrets: inherit
