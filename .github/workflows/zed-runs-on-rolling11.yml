name: Zed RunsOn five-commit cache comparison
run-name: Zed 5 commits (${{ inputs.cache_variant }}) and final same-revision warm run

on:
  workflow_dispatch:
    inputs:
      cache_variant:
        description: Cache profile for both providers.
        required: true
        type: choice
        options: [target, target-sccache, sccache-only]
        default: target
      head_ref:
        description: Final Zed source revision.
        required: true
        type: string
        default: ee3b5558c581429633937e458fad8d109f29e9ee
      cli_version:
        description: Optional exact BoringCache CLI release tag.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: zed-runs-on-rolling11
  cancel-in-progress: false
  queue: max

jobs:
  source:
    name: Resolve five first-parent Zed commits
    runs-on: ubuntu-24.04
    outputs:
      shas: ${{ steps.commits.outputs.shas }}
    steps:
      - name: Pin the source sequence
        id: commits
        env:
          HEAD_REF: ${{ inputs.head_ref }}
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" remote add origin https://github.com/zed-industries/zed.git
          git -C "$RUNNER_TEMP/source" fetch --no-tags --filter=blob:none --depth=6 origin "$HEAD_REF"
          mapfile -t shas < <(git -C "$RUNNER_TEMP/source" rev-list --first-parent --max-count=5 "$HEAD_REF" | tac)
          test "${#shas[@]}" -eq 5
          test "${shas[4]}" = "$HEAD_REF"
          echo "shas=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' "${shas[@]}")" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${shas[@]}"

  bucket-before:
    name: Inspect RunsOn bucket before Zed builds
    runs-on: ${{ format('runs-on={0}/cpu=16/ram=64/family=m7i.*+m7a/image=ubuntu24-full-x64/volume=300gb:gp3/env=benchmark/region=us-east-1/spot=false/extras=s3-cache', github.run_id) }}
    steps:
      - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2.3.1
      - uses: actions/checkout@v6
      - name: Summarize cache objects
        run: |
          mkdir -p benchmark-results
          python3 ./scripts/report-runs-on-s3.py before benchmark-results/bucket-before.json
      - uses: actions/upload-artifact@v6
        with:
          name: zed-runson-bucket-before
          path: benchmark-results/bucket-before.json
          if-no-files-found: error

  step00:
    needs: [source, bucket-before]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/zed-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: cold
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[0] }}
      rolling_step: "00"
      cli_version: ${{ inputs.cli_version }}

  step01:
    needs: [source, step00]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/zed-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: source_change
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[1] }}
      expected_parent: ${{ fromJSON(needs.source.outputs.shas)[0] }}
      rolling_step: "01"
      rolling_previous: "00"
      cli_version: ${{ inputs.cli_version }}

  step02:
    needs: [source, step01]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/zed-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: source_change
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[2] }}
      expected_parent: ${{ fromJSON(needs.source.outputs.shas)[1] }}
      rolling_step: "02"
      rolling_previous: "01"
      cli_version: ${{ inputs.cli_version }}

  step03:
    needs: [source, step02]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/zed-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: source_change
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[3] }}
      expected_parent: ${{ fromJSON(needs.source.outputs.shas)[2] }}
      rolling_step: "03"
      rolling_previous: "02"
      cli_version: ${{ inputs.cli_version }}

  step04:
    needs: [source, step03]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/zed-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: source_change
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[4] }}
      expected_parent: ${{ fromJSON(needs.source.outputs.shas)[3] }}
      rolling_step: "04"
      rolling_previous: "03"
      cli_version: ${{ inputs.cli_version }}

  step05:
    needs: [source, step04]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/zed-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: warm
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[4] }}
      rolling_step: "05"
      rolling_previous: "04"
      cli_version: ${{ inputs.cli_version }}

  report:
    name: Compare six Zed builds
    needs: step05
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: phase-zed-runson-*-step*
          path: phase-evidence
      - name: Summarize the rolling sequence
        run: |
          python3 ./scripts/benchmark-report.py summarize \
            --title "Zed five-commit RunsOn cache comparison" \
            --baseline-strategy runs-on-cache \
            --no-deltas \
            --input-dir phase-evidence \
            --output-dir benchmark-results
      - uses: actions/upload-artifact@v6
        with:
          name: zed-runson-rolling5-comparison
          path: benchmark-results/
          if-no-files-found: error

  bucket-after:
    name: Inspect RunsOn bucket after Zed builds
    needs: report
    if: always()
    runs-on: ${{ format('runs-on={0}/cpu=16/ram=64/family=m7i.*+m7a/image=ubuntu24-full-x64/volume=300gb:gp3/env=benchmark/region=us-east-1/spot=false/extras=s3-cache', github.run_id) }}
    steps:
      - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2.3.1
      - uses: actions/checkout@v6
      - name: Summarize cache objects
        run: |
          mkdir -p benchmark-results
          python3 ./scripts/report-runs-on-s3.py after benchmark-results/bucket-after.json
      - uses: actions/upload-artifact@v6
        with:
          name: zed-runson-bucket-after
          path: benchmark-results/bucket-after.json
          if-no-files-found: error
