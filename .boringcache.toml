workspace = "boringcache/benchmark-zed"

# Cargo's registry and git sources are common dependency state, not compiler
# outputs. Keep them in the adapter's default profile so both the pure sccache
# and target+sccache lanes compare the same build state as actions/cache.

[entries.cargo-registry]
tag = "zed-cargo-registry-local"

[entries.cargo-git]
tag = "zed-cargo-git-local"

[profiles.cargo-deps]
entries = ["cargo-registry", "cargo-git"]

# The opt-in target profile adds the portable Cargo build graph. Adapter-owned
# sccache and Cargo dependency state remain shared by both consumers.

[entries.zed-target]
kind = "cargo-target"
tag = "zed-target-local"
path = "upstream/target"

[profiles.zed-target]
# Explicit Action profiles replace the adapter default, so keep the common
# dependency entries in the target shape as well.
entries = ["cargo-registry", "cargo-git", "zed-target"]

[adapters.sccache]
tag = "zed-sccache-local"
no-platform = true
no-git = true
profiles = ["cargo-deps"]

[adapters.cargo]
tag = "zed-sccache-local"
profiles = ["zed-target"]
no-git = true
metadata-hints = ["benchmark=zed", "lane=cargo-product"]
