workspace = "boringcache/benchmark-zed"

# The default benchmark remains the storage-lean, pure-proxy sccache row.
# The opt-in target profile measures the product's hybrid path: the portable
# Cargo target archive restores concurrently with the adapter-owned remote
# compiler cache. Keeping the profile here makes local and CI behavior share
# one CLI-owned cache plan.

[entries.zed-target]
tag = "zed-target-local"
path = "upstream/target"

[profiles.zed-target]
entries = ["zed-target"]

[adapters.sccache]
tag = "zed-sccache-local"
no-platform = true
no-git = true
